syntax = "proto3";

package rpc.v1;

import "google/protobuf/timestamp.proto";
import "rpc/v1/rbac.proto";

option go_package = "github.com/nvcnvn/tech-office/backend/rpc/v1;rpcv1";

// ChatService provides channel-based messaging with threaded replies,
// reactions, and real-time typing indicators. Designed for reusability
// across multiple business domains (chat, project comments, CRM notes).
service ChatService {
  // Channel Management
  
  rpc CreateChannel(CreateChannelRequest) returns (CreateChannelResponse) {
    option (rpc.v1.access_control) = {
      allowed_roles: [ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }
  
  rpc GetChannel(GetChannelRequest) returns (GetChannelResponse) {
    option (rpc.v1.access_control) = {
      allowed_roles: [ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }
  
  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse) {
    option (rpc.v1.access_control) = {
      allowed_roles: [ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }
  
  rpc UpdateChannel(UpdateChannelRequest) returns (UpdateChannelResponse) {
    option (rpc.v1.access_control) = {
      allowed_roles: [ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }
  
  rpc ArchiveChannel(ArchiveChannelRequest) returns (ArchiveChannelResponse) {
    option (rpc.v1.access_control) = {
      allowed_roles: [ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }
  
  rpc UnarchiveChannel(UnarchiveChannelRequest) returns (UnarchiveChannelResponse) {
    option (rpc.v1.access_control) = {
      allowed_roles: [ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }
  
  // Channel Membership
  
  rpc JoinChannel(JoinChannelRequest) returns (JoinChannelResponse) {
    option (rpc.v1.access_control) = {
      allowed_roles: [ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }
  
  rpc LeaveChannel(LeaveChannelRequest) returns (LeaveChannelResponse) {
    option (rpc.v1.access_control) = {
      allowed_roles: [ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }
  
  rpc InviteMember(InviteMemberRequest) returns (InviteMemberResponse) {
    option (rpc.v1.access_control) = {
      allowed_roles: [ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }
  
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse) {
    option (rpc.v1.access_control) = {
      allowed_roles: [ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }
  
  rpc ListChannelMembers(ListChannelMembersRequest) returns (ListChannelMembersResponse) {
    option (rpc.v1.access_control) = {
      allowed_roles: [ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }
  
  rpc UpdateMemberRole(UpdateMemberRoleRequest) returns (UpdateMemberRoleResponse) {
    option (rpc.v1.access_control) = {
      allowed_roles: [ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }
  
  rpc UpdateNotificationPreference(UpdateNotificationPreferenceRequest) returns (UpdateNotificationPreferenceResponse) {
    option (rpc.v1.access_control) = {
      allowed_roles: [ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }
  
  // Messaging
  
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse) {
    option (rpc.v1.access_control) = {
      allowed_roles: [ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }
  
  rpc ReplyToMessage(ReplyToMessageRequest) returns (ReplyToMessageResponse) {
    option (rpc.v1.access_control) = {
      allowed_roles: [ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }
  
  rpc EditMessage(EditMessageRequest) returns (EditMessageResponse) {
    option (rpc.v1.access_control) = {
      allowed_roles: [ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }
  
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse) {
    option (rpc.v1.access_control) = {
      allowed_roles: [ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }
  
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse) {
    option (rpc.v1.access_control) = {
      allowed_roles: [ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }
  
  rpc GetMessage(GetMessageRequest) returns (GetMessageResponse) {
    option (rpc.v1.access_control) = {
      allowed_roles: [ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }
  
  rpc ListReplies(ListRepliesRequest) returns (ListRepliesResponse) {
    option (rpc.v1.access_control) = {
      allowed_roles: [ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }
  
  // Reactions
  
  rpc AddReaction(AddReactionRequest) returns (AddReactionResponse) {
    option (rpc.v1.access_control) = {
      allowed_roles: [ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }
  
  rpc RemoveReaction(RemoveReactionRequest) returns (RemoveReactionResponse) {
    option (rpc.v1.access_control) = {
      allowed_roles: [ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }
  
  rpc ListReactions(ListReactionsRequest) returns (ListReactionsResponse) {
    option (rpc.v1.access_control) = {
      allowed_roles: [ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }
  
  // Typing Indicators (ephemeral, no persistence)
  
  rpc StartTyping(StartTypingRequest) returns (StartTypingResponse) {
    option (rpc.v1.access_control) = {
      allowed_roles: [ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }
  
  rpc StopTyping(StopTypingRequest) returns (StopTypingResponse) {
    option (rpc.v1.access_control) = {
      allowed_roles: [ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }
}

// Enums

enum ChannelType {
  CHANNEL_TYPE_UNSPECIFIED = 0;
  CHANNEL_TYPE_CHAT = 1;
  CHANNEL_TYPE_DIRECT_MESSAGE = 2;
  CHANNEL_TYPE_PROJECT_TICKET_THREAD = 3;
  CHANNEL_TYPE_CRM_DEAL_NOTES = 4;
  CHANNEL_TYPE_SUPPORT_TICKET = 5;
}

enum NotificationPreference {
  NOTIFICATION_PREFERENCE_UNSPECIFIED = 0;
  NOTIFICATION_PREFERENCE_ALL = 1;
  NOTIFICATION_PREFERENCE_MENTIONS = 2;
  NOTIFICATION_PREFERENCE_MUTED = 3;
}

// Messages - Channel Management

message CreateChannelRequest {
  string title_slug = 1;  // URL-friendly slug (alphanumeric + hyphen, max 64 chars)
  string display_name = 2;  // Human-readable name
  string description = 3;  // Optional description
  ChannelType channel_type = 4;
  bool is_private = 5;
}

message CreateChannelResponse {
  Channel channel = 1;
}

message GetChannelRequest {
  string channel_id = 1;
}

message GetChannelResponse {
  Channel channel = 1;
}

message ListChannelsRequest {
  ChannelType channel_type = 1;  // Filter by type (optional)
  bool include_archived = 2;  // Include archived channels
  int32 page_size = 3;
  string page_token = 4;  // Cursor for pagination
}

message ListChannelsResponse {
  repeated Channel channels = 1;
  string next_page_token = 2;
}

message UpdateChannelRequest {
  string channel_id = 1;
  optional string display_name = 2;
  optional string description = 3;
  optional bool is_private = 4;
}

message UpdateChannelResponse {
  Channel channel = 1;
}

message ArchiveChannelRequest {
  string channel_id = 1;
}

message ArchiveChannelResponse {
  Channel channel = 1;
}

message UnarchiveChannelRequest {
  string channel_id = 1;
}

message UnarchiveChannelResponse {
  Channel channel = 1;
}

// Messages - Channel Membership

message JoinChannelRequest {
  string channel_id = 1;
}

message JoinChannelResponse {
  ChannelMembership membership = 1;
}

message LeaveChannelRequest {
  string channel_id = 1;
}

message LeaveChannelResponse {
  bool success = 1;
}

message InviteMemberRequest {
  string channel_id = 1;
  string employee_id = 2;  // Employee to invite
}

message InviteMemberResponse {
  ChannelMembership membership = 1;
}

message RemoveMemberRequest {
  string channel_id = 1;
  string employee_id = 2;  // Employee to remove
}

message RemoveMemberResponse {
  bool success = 1;
}

message ListChannelMembersRequest {
  string channel_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListChannelMembersResponse {
  repeated ChannelMembership memberships = 1;
  string next_page_token = 2;
}

message UpdateMemberRoleRequest {
  string channel_id = 1;
  string employee_id = 2;
  bool is_admin = 3;
}

message UpdateMemberRoleResponse {
  ChannelMembership membership = 1;
}

message UpdateNotificationPreferenceRequest {
  string channel_id = 1;
  NotificationPreference preference = 2;
}

message UpdateNotificationPreferenceResponse {
  ChannelMembership membership = 1;
}

// Messages - Messaging

message SendMessageRequest {
  string channel_id = 1;
  string message_text = 2;  // Max ~10k characters
}

message SendMessageResponse {
  Message message = 1;
}

message ReplyToMessageRequest {
  string parent_message_id = 1;
  string message_text = 2;
}

message ReplyToMessageResponse {
  Message message = 1;
}

message EditMessageRequest {
  string message_id = 1;
  string new_text = 2;
}

message EditMessageResponse {
  Message message = 1;
}

message DeleteMessageRequest {
  string message_id = 1;
}

message DeleteMessageResponse {
  bool success = 1;
}

message ListMessagesRequest {
  string channel_id = 1;
  int32 page_size = 2;  // Default 50
  string page_token = 3;  // Cursor (base64-encoded timestamp)
}

message ListMessagesResponse {
  repeated Message messages = 1;
  string next_page_token = 2;
}

message GetMessageRequest {
  string message_id = 1;
}

message GetMessageResponse {
  Message message = 1;
}

message ListRepliesRequest {
  string parent_message_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListRepliesResponse {
  repeated Message replies = 1;
  string next_page_token = 2;
}

// Messages - Reactions

message AddReactionRequest {
  string message_id = 1;
  string emoji_code = 2;  // Unicode emoji or shortcode
}

message AddReactionResponse {
  Reaction reaction = 1;
}

message RemoveReactionRequest {
  string message_id = 1;
  string emoji_code = 2;
}

message RemoveReactionResponse {
  bool success = 1;
}

message ListReactionsRequest {
  string message_id = 1;
}

message ListReactionsResponse {
  repeated ReactionSummary reactions = 1;  // Aggregated by emoji
}

// Messages - Typing Indicators

message StartTypingRequest {
  string channel_id = 1;
}

message StartTypingResponse {
  bool success = 1;
}

message StopTypingRequest {
  string channel_id = 1;
}

message StopTypingResponse {
  bool success = 1;
}

// Entity Messages

message Channel {
  string id = 1;
  string organization_id = 2;
  string title_slug = 3;
  string display_name = 4;
  string description = 5;
  ChannelType channel_type = 6;
  bool is_private = 7;
  bool is_archived = 8;
  string created_by_employee_id = 9;
  google.protobuf.Timestamp updated_at = 10;
  
  // Computed fields (not stored in DB)
  int32 member_count = 11;
  bool is_member = 12;  // Whether current user is a member
  ChannelMembership current_user_membership = 13;  // Current user's membership details
}

message ChannelMembership {
  string id = 1;
  string organization_id = 2;
  string channel_id = 3;
  string employee_id = 4;
  bool is_admin = 5;
  NotificationPreference notification_preference = 6;
  google.protobuf.Timestamp joined_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  
  // Populated from organization.employee (via JOIN)
  string employee_name = 9;
  string employee_email = 10;
}

message Message {
  string id = 1;
  string organization_id = 2;
  string channel_id = 3;
  string message_text = 4;
  string author_employee_id = 5;
  string parent_message_id = 6;  // NULL for top-level messages
  bool is_deleted = 7;
  bool is_edited = 8;
  google.protobuf.Timestamp updated_at = 9;
  
  // Populated from organization.employee (via JOIN)
  string author_name = 10;
  string author_email = 11;
  
  // Computed fields
  int32 reply_count = 12;  // Number of replies to this message
  repeated ReactionSummary reactions = 13;  // Aggregated reactions
}

message Reaction {
  string id = 1;
  string organization_id = 2;
  string message_id = 3;
  string employee_id = 4;
  string emoji_code = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message ReactionSummary {
  string emoji_code = 1;
  int32 count = 2;  // Number of employees who used this emoji
  repeated string employee_ids = 3;  // List of employee IDs (for tooltips)
  bool current_user_reacted = 4;  // Whether current user used this emoji
}
