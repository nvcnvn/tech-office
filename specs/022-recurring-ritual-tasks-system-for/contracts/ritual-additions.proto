// ============================================================
// NEW MESSAGES — Task Evidence Progress
// ============================================================

// Lightweight evidence progress for embedding in Task responses.
// Avoids the need for a separate ListEvidenceSubmissions call
// when rendering task lists/cards in the UI.
message TaskEvidenceProgress {
  int32 total_requirements = 1;     // total evidence requirements from ritual definition
  int32 required_count = 2;         // how many are is_required=true
  int32 submitted_count = 3;        // how many have at least one submission
  int32 approved_count = 4;         // how many have an approved submission
  int32 rejected_count = 5;         // how many have a rejected submission (needs resubmit)
  int32 pending_review_count = 6;   // how many submitted but awaiting review
  bool all_required_approved = 7;   // true when all required evidence is approved
}

// Evidence requirement with its latest submission status for a specific task.
// Used in task detail views to show the evidence checklist.
message TaskEvidenceRequirementStatus {
  EvidenceRequirement requirement = 1;
  ApprovalStatus status = 2;                      // current status for this task
  repeated EvidenceSubmission submissions = 3;    // submissions for this requirement on this task
}

