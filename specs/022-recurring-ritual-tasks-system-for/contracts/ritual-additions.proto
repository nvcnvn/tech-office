// Task message — add:
//   TaskKind task_kind = N;
//   string ritual_definition_id = N;             // set when task_kind = RITUAL_INSTANCE
//   google.protobuf.Timestamp scheduled_date = N;
//   google.protobuf.Timestamp completion_deadline = N;
//   string skip_reason = N;
//   TaskEvidenceProgress evidence_progress = N;  // populated for ritual instances (nullable for standard tasks)
//   string ritual_definition_name = N;           // denormalized for display — avoids extra lookup
