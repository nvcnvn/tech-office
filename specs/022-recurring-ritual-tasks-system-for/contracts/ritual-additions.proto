// ============================================================
// NEW RPC — Task Evidence Details (full checklist for task detail view)
// ============================================================

message GetTaskEvidenceDetailsRequest {
  string task_id = 1;
}

message GetTaskEvidenceDetailsResponse {
  repeated TaskEvidenceRequirementStatus requirements = 1;
  TaskEvidenceProgress progress = 2;
}

