// Employee Import Extensions for IAMService
// Protocol Buffer Definition for Tech Office Employee Import Feature
//
// These message types and methods should be added to backend/rpc/v1/iam.proto
// This file is NOT a standalone service - it documents the additions to IAMService

syntax = "proto3";

package rpc.v1;

import "rpc/v1/rbac.proto";

option go_package = "github.com/nvcnvn/tech-office/backend/rpc/v1;rpcv1";

