syntax = "proto3";

package rpc.v1;

import "google/protobuf/timestamp.proto";
import "rpc/v1/access_control.proto";

option go_package = "github.com/nvcnvn/tech-office/backend/rpc/v1;rpcv1";

// FileService provides file operations including security validation,
// access control, search, and PDF conversion.
//
// ARCHITECTURE NOTE - Domain-Owned Upload Pattern:
// FileService DOES NOT provide context-based upload RPCs (chat attachments, project files, etc.)
// to prevent circular dependencies. Domain services own their upload flows:
// - Chat attachments: ChatFileService.RequestChannelFileUpload (see chat_files.proto)
// - Department docs: DocsService.RequestDepartmentFileUpload (future)
// - Project files: ProjectService.RequestProjectFileUpload (future)
//
// FileService ONLY provides avatar upload (no context, public scope, simplified flow).
// See ARCHITECTURE-REFACTOR.md for full rationale.
service FileService {
  // ValidateFile checks file type integrity using magic byte detection.
  // Returns validation result (verified, warning, failed) without blocking upload.
  // This RPC is called AFTER file is uploaded to R2 to validate type matches MIME type claim.
  rpc ValidateFile(ValidateFileRequest) returns (ValidateFileResponse) {
    option (access_control) = {
      allowed_roles: [ROLE_ADMIN, ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }

  // SetFileAccessRule creates or updates access control rules for a file.
  // Links file to upload context (channel, project, etc.) and defines access scope.
  // Only file uploader or organization admin can set access rules.
  rpc SetFileAccessRule(SetFileAccessRuleRequest) returns (SetFileAccessRuleResponse) {
    option (access_control) = {
      allowed_roles: [ROLE_ADMIN, ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }

  // CheckFileAccess verifies if current user can access a specific file.
  // Checks context membership (channel, project, department) and access scope.
  // Returns access decision and reason for denial if applicable.
  rpc CheckFileAccess(CheckFileAccessRequest) returns (CheckFileAccessResponse) {
    option (access_control) = {
      allowed_roles: [ROLE_ADMIN, ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }

  // SearchFiles searches across filenames and content using full-text search.
  // Results filtered by user's access permissions (context membership).
  // Uses PGroonga for multilingual search with fuzzy matching.
  rpc SearchFiles(SearchFilesRequest) returns (SearchFilesResponse) {
    option (access_control) = {
      allowed_roles: [ROLE_ADMIN, ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }

  // GetPDFConversionStatus checks status of PDF conversion for an office document.
  // Returns conversion status, download URL for PDF, or error message if failed.
  rpc GetPDFConversionStatus(GetPDFConversionStatusRequest) returns (GetPDFConversionStatusResponse) {
    option (access_control) = {
      allowed_roles: [ROLE_ADMIN, ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }

  // TriggerPDFConversion manually triggers PDF conversion for an office document.
  // Usually conversion happens automatically on upload, but this allows retry.
  // Only file uploader or organization admin can trigger conversion.
  rpc TriggerPDFConversion(TriggerPDFConversionRequest) returns (TriggerPDFConversionResponse) {
    option (access_control) = {
      allowed_roles: [ROLE_ADMIN, ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }

  // GetContentIndexStatus checks status of content extraction and indexing.
  // Returns indexing status or error message if extraction failed.
  rpc GetContentIndexStatus(GetContentIndexStatusRequest) returns (GetContentIndexStatusResponse) {
    option (access_control) = {
      allowed_roles: [ROLE_ADMIN, ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
      allow_unauthenticated: false
    };
  }
}

// ========== Validation Messages ==========

message ValidateFileRequest {
  string file_id = 1;  // File to validate
}

message ValidateFileResponse {
  FileValidationResult validation_result = 1;
}

message FileValidationResult {
  ValidationStatus status = 1;
  string message = 2;  // Human-readable message (e.g., "Type mismatch: declared PDF, detected PNG")
  string declared_mime_type = 3;
  string detected_mime_type = 4;
}

enum ValidationStatus {
  VALIDATION_STATUS_UNSPECIFIED = 0;
  VALIDATION_STATUS_VERIFIED = 1;    // Type matches declared MIME type
  VALIDATION_STATUS_WARNING = 2;     // Type mismatch but upload allowed
  VALIDATION_STATUS_FAILED = 3;      // Validation error (corrupted file, etc.)
  VALIDATION_STATUS_SKIPPED = 4;     // No validation performed
}

// ========== Access Control Messages ==========

message SetFileAccessRuleRequest {
  string file_id = 1;
  FileContextType context_type = 2;
  string context_id = 3;  // ID of channel, project, etc.
  FileAccessScope access_scope = 4;
}

message SetFileAccessRuleResponse {
  FileAccessRule access_rule = 1;
}

message CheckFileAccessRequest {
  string file_id = 1;
}

message CheckFileAccessResponse {
  bool has_access = 1;
  string denial_reason = 2;  // Human-readable reason if has_access = false
  FileAccessRule access_rule = 3;  // Context information if has_access = true
}

message FileAccessRule {
  string id = 1;
  string file_id = 2;
  FileContextType context_type = 3;
  string context_id = 4;
  FileAccessScope access_scope = 5;
  google.protobuf.Timestamp updated_at = 6;
}

enum FileContextType {
  FILE_CONTEXT_TYPE_UNSPECIFIED = 0;
  FILE_CONTEXT_TYPE_CHAT_CHANNEL = 1;
  FILE_CONTEXT_TYPE_PROJECT = 2;
  FILE_CONTEXT_TYPE_DEPARTMENT_DOCS = 3;
  FILE_CONTEXT_TYPE_CALENDAR_EVENT = 4;
  FILE_CONTEXT_TYPE_SUPPORT_TICKET = 5;
  FILE_CONTEXT_TYPE_CRM_DEAL = 6;
}

enum FileAccessScope {
  FILE_ACCESS_SCOPE_UNSPECIFIED = 0;
  FILE_ACCESS_SCOPE_PUBLIC = 1;      // All organization members
  FILE_ACCESS_SCOPE_PRIVATE = 2;     // Context members only
  FILE_ACCESS_SCOPE_DEPARTMENT = 3;  // Department members only
}

// ========== Search Messages ==========

message SearchFilesRequest {
  string query = 1;  // Search query (searches filename and content)
  int32 limit = 2;   // Max results (default 50, max 100)
  int32 offset = 3;  // Pagination offset
  repeated FileContextType context_types = 4;  // Filter by context type (optional)
}

message SearchFilesResponse {
  repeated FileSearchResult results = 1;
  int32 total_count = 2;  // Total matching files (for pagination)
  bool has_more = 3;      // Whether more results available
}

message FileSearchResult {
  string file_id = 1;
  string filename = 2;
  int64 size_bytes = 3;
  string mime_type = 4;
  ValidationStatus validation_status = 5;
  
  // Context information
  FileContextType context_type = 6;
  string context_id = 7;
  string context_display_name = 8;  // E.g., "Engineering Team Chat"
  
  // Search relevance
  double relevance_score = 9;  // PGroonga relevance score
  string excerpt = 10;         // Relevant excerpt from content (if content match)
  
  // Metadata
  string uploaded_by_employee_id = 11;
  string uploaded_by_name = 12;
  google.protobuf.Timestamp uploaded_at = 13;
}

// ========== PDF Conversion Messages ==========

message GetPDFConversionStatusRequest {
  string file_id = 1;  // Original file ID
}

message GetPDFConversionStatusResponse {
  PDFConversionInfo conversion_info = 1;
}

message TriggerPDFConversionRequest {
  string file_id = 1;  // Original file ID
}

message TriggerPDFConversionResponse {
  PDFConversionInfo conversion_info = 1;
}

message PDFConversionInfo {
  string conversion_id = 1;
  string original_file_id = 2;
  ConversionStatus status = 3;
  string pdf_download_url = 4;  // Presigned URL if conversion completed
  int64 pdf_size_bytes = 5;
  string error_message = 6;     // Error if conversion failed
  int32 duration_ms = 7;        // Conversion duration (if completed)
  google.protobuf.Timestamp updated_at = 8;
}

enum ConversionStatus {
  CONVERSION_STATUS_UNSPECIFIED = 0;
  CONVERSION_STATUS_PENDING = 1;      // Queued for conversion
  CONVERSION_STATUS_IN_PROGRESS = 2;  // Currently converting
  CONVERSION_STATUS_COMPLETED = 3;    // Conversion successful
  CONVERSION_STATUS_FAILED = 4;       // Conversion failed
}

// ========== Content Indexing Messages ==========

message GetContentIndexStatusRequest {
  string file_id = 1;
}

message GetContentIndexStatusResponse {
  ContentIndexInfo index_info = 1;
}

message ContentIndexInfo {
  string index_id = 1;
  string file_id = 2;
  IndexingStatus status = 3;
  ExtractionMethod extraction_method = 4;
  string error_message = 5;     // Error if indexing failed
  int32 duration_ms = 6;        // Indexing duration (if completed)
  int32 text_length = 7;        // Length of extracted text (if completed)
  google.protobuf.Timestamp updated_at = 8;
}

enum IndexingStatus {
  INDEXING_STATUS_UNSPECIFIED = 0;
  INDEXING_STATUS_PENDING = 1;      // Queued for indexing
  INDEXING_STATUS_IN_PROGRESS = 2;  // Currently extracting text
  INDEXING_STATUS_COMPLETED = 3;    // Indexing successful
  INDEXING_STATUS_FAILED = 4;       // Indexing failed
}

enum ExtractionMethod {
  EXTRACTION_METHOD_UNSPECIFIED = 0;
  EXTRACTION_METHOD_OFFICE_PARSER = 1;  // DOCX/XLSX/PPTX parser
  EXTRACTION_METHOD_PDF_PARSER = 2;     // PDF text extraction
  EXTRACTION_METHOD_IMAGE_OCR = 3;      // OCR for images (future)
  EXTRACTION_METHOD_PLAIN_TEXT = 4;     // Plain text files
}
