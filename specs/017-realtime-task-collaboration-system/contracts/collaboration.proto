  }
  
  rpc DeleteSavedView(DeleteSavedViewRequest) returns (DeleteSavedViewResponse) {
    option (rpc.v1.access_control) = {
      allowed_roles: [ROLE_ADMIN, ROLE_OWNER, ROLE_OPERATOR, ROLE_EMPLOYEE]
