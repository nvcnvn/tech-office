// =============================================================================
// MESSAGES - Analytics
// =============================================================================

message GetTaskAnalyticsRequest {
  string project_id = 1;
  
  // Group by dimensions
  repeated string group_by = 2; // "state", "assignee", "level", "custom_field:{field_id}"
  
  // Aggregations
  repeated AnalyticsAggregation aggregations = 3;
  
  // Filters
  repeated AnalyticsFilter filters = 4;
  
  // Date range
  optional string start_date = 5;
  optional string end_date = 6;
}

message AnalyticsAggregation {
  string field = 1; // "count", "custom_field:{field_id}"
  string function = 2; // "count", "sum", "avg", "min", "max"
  string alias = 3;
}

message AnalyticsFilter {
  string field = 1;
  string operator = 2; // "eq", "ne", "gt", "lt", "gte", "lte", "in", "not_in"
  google.protobuf.Value value = 3;
}

message GetTaskAnalyticsResponse {
  repeated AnalyticsRow rows = 1;
  AnalyticsSummary summary = 2;
}

message AnalyticsRow {
  map<string, google.protobuf.Value> dimensions = 1;
  map<string, double> metrics = 2;
}

message AnalyticsSummary {
  int32 total_tasks = 1;
  int32 completed_tasks = 2;
  int32 open_tasks = 3;
  double completion_rate = 4;
}

message ExportTasksCSVRequest {
  string project_id = 1;
  repeated string columns = 2; // Column names to include
  repeated AnalyticsFilter filters = 3;
}

message ExportTasksCSVResponse {
  bytes csv_data = 1;
  string filename = 2;
}
