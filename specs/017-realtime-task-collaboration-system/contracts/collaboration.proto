// =============================================================================
// ENUMS
// =============================================================================

enum ProjectVisibility {
  PROJECT_VISIBILITY_UNSPECIFIED = 0;
  PROJECT_VISIBILITY_PUBLIC = 1;
  PROJECT_VISIBILITY_PRIVATE = 2;
}

enum StateCategory {
  STATE_CATEGORY_UNSPECIFIED = 0;
  STATE_CATEGORY_TODO = 1;
  STATE_CATEGORY_IN_PROGRESS = 2;
  STATE_CATEGORY_DONE = 3;
  STATE_CATEGORY_CANCELLED = 4;
}

enum CustomFieldType {
  CUSTOM_FIELD_TYPE_UNSPECIFIED = 0;
  CUSTOM_FIELD_TYPE_TEXT = 1;
  CUSTOM_FIELD_TYPE_NUMBER = 2;
  CUSTOM_FIELD_TYPE_SINGLE_SELECT = 3;
  CUSTOM_FIELD_TYPE_MULTI_SELECT = 4;
  CUSTOM_FIELD_TYPE_DATE = 5;
  CUSTOM_FIELD_TYPE_USER = 6;
  CUSTOM_FIELD_TYPE_CHECKBOX = 7;
}

enum WorkflowTriggerType {
  WORKFLOW_TRIGGER_TYPE_UNSPECIFIED = 0;
  WORKFLOW_TRIGGER_TYPE_STATE_ENTERED = 1;
  WORKFLOW_TRIGGER_TYPE_STATE_EXITED = 2;
  WORKFLOW_TRIGGER_TYPE_FIELD_CHANGED = 3;
  WORKFLOW_TRIGGER_TYPE_TASK_CREATED = 4;
}

enum WorkflowActionType {
  WORKFLOW_ACTION_TYPE_UNSPECIFIED = 0;
  WORKFLOW_ACTION_TYPE_SET_STATE = 1;
  WORKFLOW_ACTION_TYPE_SET_FIELD = 2;
  WORKFLOW_ACTION_TYPE_ASSIGN_USER = 3;
  WORKFLOW_ACTION_TYPE_NOTIFY = 4;
  WORKFLOW_ACTION_TYPE_CLOSE_TASK = 5;
}

enum ProjectMemberRole {
  PROJECT_MEMBER_ROLE_UNSPECIFIED = 0;
  PROJECT_MEMBER_ROLE_OWNER = 1;
  PROJECT_MEMBER_ROLE_ADMIN = 2;
  PROJECT_MEMBER_ROLE_MEMBER = 3;
  PROJECT_MEMBER_ROLE_VIEWER = 4;
}

enum TaskAssigneeRole {
  TASK_ASSIGNEE_ROLE_UNSPECIFIED = 0;
  TASK_ASSIGNEE_ROLE_ASSIGNEE = 1;
  TASK_ASSIGNEE_ROLE_REVIEWER = 2;
  TASK_ASSIGNEE_ROLE_APPROVER = 3;
}

enum ViewType {
  VIEW_TYPE_UNSPECIFIED = 0;
  VIEW_TYPE_BOARD = 1;
  VIEW_TYPE_LIST = 2;
  VIEW_TYPE_GANTT = 3;
  VIEW_TYPE_CALENDAR = 4;
}

enum NotificationPreference {
  NOTIFICATION_PREFERENCE_UNSPECIFIED = 0;
  NOTIFICATION_PREFERENCE_ALL = 1;
  NOTIFICATION_PREFERENCE_MENTIONS = 2;
  NOTIFICATION_PREFERENCE_ASSIGNED = 3;
  NOTIFICATION_PREFERENCE_MUTED = 4;
}

// =============================================================================
// MESSAGES - Project
// =============================================================================

message Project {
  string id = 1;
  string name = 2;
  string key = 3;
  string description = 4;
  ProjectVisibility visibility = 5;
  bool is_archived = 6;
  string owner_employee_id = 7;
  int32 member_count = 8;
  int32 task_count = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message CreateProjectRequest {
  string name = 1;
  string key = 2;
  string description = 3;
  ProjectVisibility visibility = 4;
  repeated DefaultState default_states = 5; // Optional: create with default states
}

message DefaultState {
  string name = 1;
  string color = 2;
  StateCategory category = 3;
  bool is_initial = 4;
  bool is_closed = 5;
}

message CreateProjectResponse {
  Project project = 1;
  repeated ProjectState states = 2;
  repeated TaskLevel levels = 3;
}

message GetProjectRequest {
  string project_id = 1;
}

message GetProjectResponse {
  Project project = 1;
  repeated ProjectState states = 2;
  repeated TaskLevel levels = 3;
  ProjectMemberRole current_user_role = 4;
}

message UpdateProjectRequest {
  string project_id = 1;
  optional string name = 2;
  optional string description = 3;
  optional ProjectVisibility visibility = 4;
}

message UpdateProjectResponse {
  Project project = 1;
}

message ListProjectsRequest {
  optional bool include_archived = 1;
  optional string cursor = 2;
  optional int32 limit = 3;
}

message ListProjectsResponse {
  repeated Project projects = 1;
  optional string next_cursor = 2;
}

message ArchiveProjectRequest {
  string project_id = 1;
  bool archive = 2; // true = archive, false = unarchive
}

message ArchiveProjectResponse {
  Project project = 1;
}

// =============================================================================
// MESSAGES - Project State
// =============================================================================

message ProjectState {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string color = 4;
  StateCategory category = 5;
  int32 position = 6;
  bool is_initial = 7;
  bool is_closed = 8;
}

message CreateProjectStateRequest {
  string project_id = 1;
  string name = 2;
  string color = 3;
  StateCategory category = 4;
  optional int32 position = 5;
  optional bool is_initial = 6;
  optional bool is_closed = 7;
}

message CreateProjectStateResponse {
  ProjectState state = 1;
}

message UpdateProjectStateRequest {
  string state_id = 1;
  optional string name = 2;
  optional string color = 3;
  optional StateCategory category = 4;
  optional bool is_initial = 5;
  optional bool is_closed = 6;
}

message UpdateProjectStateResponse {
  ProjectState state = 1;
}

message DeleteProjectStateRequest {
  string state_id = 1;
  string migrate_to_state_id = 2; // Move existing tasks to this state
}

message DeleteProjectStateResponse {
  int32 tasks_migrated = 1;
}

message ReorderProjectStatesRequest {
  string project_id = 1;
  repeated string state_ids = 2; // New order
}

message ReorderProjectStatesResponse {
  repeated ProjectState states = 1;
}

message ListProjectStatesRequest {
  string project_id = 1;
}

message ListProjectStatesResponse {
  repeated ProjectState states = 1;
}

// =============================================================================
// MESSAGES - Task Level
// =============================================================================

message TaskLevel {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string icon = 4;
  string color = 5;
  int32 depth = 6;
}

message CreateTaskLevelRequest {
  string project_id = 1;
  string name = 2;
  optional string icon = 3;
  optional string color = 4;
  int32 depth = 5;
}

message CreateTaskLevelResponse {
  TaskLevel level = 1;
}

message UpdateTaskLevelRequest {
  string level_id = 1;
  optional string name = 2;
  optional string icon = 3;
  optional string color = 4;
}

message UpdateTaskLevelResponse {
  TaskLevel level = 1;
}

message DeleteTaskLevelRequest {
  string level_id = 1;
  string migrate_to_level_id = 2; // Move existing tasks to this level
}

message DeleteTaskLevelResponse {
  int32 tasks_migrated = 1;
}

message ListTaskLevelsRequest {
  string project_id = 1;
}

message ListTaskLevelsResponse {
  repeated TaskLevel levels = 1;
}

// =============================================================================
// MESSAGES - Task
// =============================================================================

message Task {
  string id = 1;
  string project_id = 2;
  string identifier = 3; // e.g., "PROJ-123"
  string title = 4;
  
  // Hierarchy
  optional string parent_task_id = 5;
  int32 depth = 6;
  string level_id = 7;
  int32 child_count = 8;
  
  // Workflow
  string state_id = 9;
  
  // Scheduling
  optional string start_date = 10; // ISO date string
  optional string due_date = 11;
  optional double estimated_hours = 12;
  
  // Integrations
  optional string channel_id = 13;
  optional string description_document_id = 14;
  repeated string file_ids = 15;
  
  // People
  string reporter_employee_id = 16;
  repeated TaskAssignee assignees = 17;
  
  // Metadata
  int32 comment_count = 18;
  google.protobuf.Timestamp updated_at = 19;
  
  // Custom fields (populated if requested)
  repeated CustomFieldValue custom_field_values = 20;
}

message TaskAssignee {
  string employee_id = 1;
  TaskAssigneeRole role = 2;
  google.protobuf.Timestamp assigned_at = 3;
}

message CreateTaskRequest {
  string project_id = 1;
  string title = 2;
  string level_id = 3;
  
  optional string parent_task_id = 4;
  optional string state_id = 5; // Uses initial state if not provided
  optional string start_date = 6;
  optional string due_date = 7;
  optional double estimated_hours = 8;
  
  repeated string assignee_employee_ids = 9;
  repeated CreateCustomFieldValueInput custom_fields = 10;
}

message CreateCustomFieldValueInput {
  string field_id = 1;
  google.protobuf.Value value = 2;
}

message CreateTaskResponse {
  Task task = 1;
}

message GetTaskRequest {
  string task_id = 1;
  bool include_custom_fields = 2;
}

message GetTaskResponse {
  Task task = 1;
  repeated TaskWatcher watchers = 2;
}

message TaskWatcher {
  string employee_id = 1;
  string watch_reason = 2;
}

message UpdateTaskRequest {
  string task_id = 1;
  optional string title = 2;
  optional string state_id = 3;
  optional string start_date = 4;
  optional string due_date = 5;
  optional double estimated_hours = 6;
  optional string level_id = 7;
  optional string parent_task_id = 8;
}

message UpdateTaskResponse {
  Task task = 1;
  repeated WorkflowRuleExecution rule_executions = 2;
}

message WorkflowRuleExecution {
  string rule_id = 1;
  string rule_name = 2;
  string status = 3;
  optional string error_message = 4;
}

message DeleteTaskRequest {
  string task_id = 1;
  bool delete_children = 2; // If true, cascade delete children
}

message DeleteTaskResponse {
  int32 tasks_deleted = 1;
}

message ListTasksRequest {
  string project_id = 1;
  
  // Filters
  optional string state_id = 2;
  optional string assignee_employee_id = 3;
  optional string reporter_employee_id = 4;
  optional string level_id = 5;
  optional string parent_task_id = 6;
  optional bool root_only = 7; // Only return tasks without parent
  
  // Search
  optional string search_query = 8;
  
  // Pagination
  optional string cursor = 9;
  optional int32 limit = 10;
  
  // Options
  bool include_custom_fields = 11;
}

message ListTasksResponse {
  repeated Task tasks = 1;
  optional string next_cursor = 2;
}

message MoveTaskRequest {
  string task_id = 1;
  string new_state_id = 2;
  optional int32 position_in_state = 3; // Optional ordering within state
}

message MoveTaskResponse {
  Task task = 1;
  repeated WorkflowRuleExecution rule_executions = 2;
}

message GetTaskByIdentifierRequest {
  string project_id = 1;
  string identifier = 2; // e.g., "PROJ-123"
}

message GetTaskByIdentifierResponse {
  Task task = 1;
}

// =============================================================================
// MESSAGES - Task Assignment
// =============================================================================

message AssignTaskRequest {
  string task_id = 1;
  string employee_id = 2;
  TaskAssigneeRole role = 3;
}

message AssignTaskResponse {
  Task task = 1;
}

message UnassignTaskRequest {
  string task_id = 1;
  string employee_id = 2;
  optional TaskAssigneeRole role = 3; // If provided, only remove this role
}

message UnassignTaskResponse {
  Task task = 1;
}

message WatchTaskRequest {
  string task_id = 1;
}

message WatchTaskResponse {
  bool watching = 1;
}

message UnwatchTaskRequest {
  string task_id = 1;
}

message UnwatchTaskResponse {
  bool watching = 1;
}

// =============================================================================
// MESSAGES - Custom Fields
// =============================================================================

message CustomFieldDefinition {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string description = 4;
  CustomFieldType field_type = 5;
  repeated string options = 6; // For select types
  google.protobuf.Value default_value = 7;
  bool is_required = 8;
  optional double min_value = 9;
  optional double max_value = 10;
  int32 position = 11;
  bool is_archived = 12;
}

message CustomFieldValue {
  string field_id = 1;
  string field_name = 2;
  CustomFieldType field_type = 3;
  google.protobuf.Value value = 4;
}

message CreateCustomFieldRequest {
  string project_id = 1;
  string name = 2;
  optional string description = 3;
  CustomFieldType field_type = 4;
  repeated string options = 5;
  optional google.protobuf.Value default_value = 6;
  optional bool is_required = 7;
