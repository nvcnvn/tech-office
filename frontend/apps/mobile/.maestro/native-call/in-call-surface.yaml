appId: com.devguards.TechOffice
name: "Native call — in-app in-call surface"
tags:
  - voice
  - native-call
---
# What this can and cannot cover.
#
# The incoming-call screen and the lock-screen controls are drawn by the operating
# system, and Maestro cannot see them — no flow here can prove the headline behaviour.
# That is the manual device matrix in specs/037-native-call-wakeup/quickstart.md.
#
# What Maestro *can* prove is the half that stays inside the app: that the in-call
# surface agrees with the call the OS is showing, and that it goes away when the call
# ends. A surface that disagrees with the system UI is the second-worst failure this
# feature has, after an orphaned call screen — the user mutes in one place and is still
# heard in the other.

- runFlow: "../auth/signin.yaml"
- runFlow:
    when:
      visible:
        id: "xmark"
    commands:
      - tapOn:
          id: "xmark"

- extendedWaitUntil:
    visible: "Chat"
    timeout: 15000
- tapOn:
    text: "Chat"
- extendedWaitUntil:
    visible:
      id: "channel-row-.*"
    timeout: 15000
- tapOn:
    id: "channel-row-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "channel-header-title"
    timeout: 8000

# On the call's own conversation the in-call surface is the channel's call banner. The
# global return bar is deliberately not drawn here — it exists to return you to this
# screen, and stacking it above the banner and the OS call chip put three rows of the
# same call on one screen. Assert that absence, so re-introducing the duplicate fails.
- runFlow:
    when:
      visible:
        id: "voice-call-banner"
    commands:
      - takeScreenshot: "tmp/maestro-screenshots/native-call-in-call-surface"
      - assertNotVisible:
          id: "active-voice-call-bar"
      # The banner must offer a way out. A call the user can hear but cannot leave from
      # the app is the in-app half of the orphan problem.
      - assertVisible:
          id: "voice-call-leave-button"
      - tapOn:
          id: "voice-call-leave-button"
      # Ending the call must remove the surface, not leave a stale banner behind.
      - extendedWaitUntil:
          notVisible:
            id: "voice-call-banner"
          timeout: 8000

# And the return bar must still appear once the call's conversation is not the open
# screen — that is the whole reason it exists.
- runFlow:
    when:
      visible:
        id: "voice-call-banner"
    commands:
      - tapOn:
          text: "Chat"
      - extendedWaitUntil:
          visible:
            id: "active-voice-call-bar"
          timeout: 8000
