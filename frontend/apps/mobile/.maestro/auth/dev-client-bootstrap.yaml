appId: com.devguards.TechOffice
name: "Dev client — open the app on the Metro bundle"
# Shared first step for every flow that starts from a fresh install.
#
# The dev-client launcher only lists a Metro server it can discover on the same host, so
# tapping it works on a simulator or emulator and finds nothing on a physical device,
# where Metro is across the LAN. Opening the bundle URL directly works in both places,
# so there is one bootstrap rather than one per target. MAESTRO_DEV_CLIENT_URL is
# supplied by the Makefile and by scripts/run-maestro-suite.sh, both of which resolve the
# same LAN IP the app is built against.
---
- launchApp:
    clearState: true
    clearKeychain: true

# The launcher has to be on screen before the link lands: a deep link delivered while the
# process is still coming up after a state clear is dropped, and the run then sits on the
# launcher until the wait gives up. "Development Build" is the launcher's subtitle on both
# platforms; the rest of that screen differs between them.
- extendedWaitUntil:
    visible: "Development Build"
    timeout: 60000
- openLink: "${MAESTRO_DEV_CLIENT_URL}"

# iOS routes an opened link through the system, which asks before handing it to the app —
# but only the first time in a session, so this is a conditional, not a wait.
- runFlow:
    when:
      platform: iOS
      visible: "Open"
    commands:
      - tapOn: "Open"

# The developer menu sits over the app and has to be closed, or every later assertion
# reads the menu instead of the screen. It is shaped differently on each platform:
# Android puts the greeting on its own page behind a Continue button and labels the close
# control only with a content description; iOS shows the greeting inside the menu and
# exposes the SF Symbol as an accessibility identifier. Matching one platform's control
# and letting the other fall through is how this menu stayed open on Android.
#
# The Android wait is also where a cold Metro's first bundle is paid for: a timeout here
# says "the bundle never arrived", rather than surfacing as a missing sign-in button.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "Continue"
          timeout: 180000
      - tapOn: "Continue"
      - extendedWaitUntil:
          visible: "Close"
          timeout: 15000
      - tapOn: "Close"
- runFlow:
    when:
      platform: iOS
    commands:
      # The menu's close control is the anchor on iOS: it carries a stable identifier,
      # while the greeting text around it is laid out differently from Android's. This is
      # also where a cold Metro's first bundle is paid for on this platform.
      - extendedWaitUntil:
          visible:
            id: "xmark"
          timeout: 180000
      - tapOn:
          id: "xmark"
