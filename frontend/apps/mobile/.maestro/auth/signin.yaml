appId: com.devguards.TechOffice
name: "Auth — Sign in with email"
# The email path, reached as the quiet secondary action on the PIN-first sign-in screen.
# Screen flows use this as their shared bootstrap, so it authenticates with credentials
# that do not depend on a PIN having been set.
---
- runFlow: "dev-client-bootstrap.yaml"

# The sign-in screen opens on the PIN sequence. Email is the quiet secondary action.
- extendedWaitUntil:
    visible:
      id: "signin-with-email"
    timeout: 15000
- tapOn:
    id: "signin-with-email"

- extendedWaitUntil:
    visible:
      id: "subdomain-input"
    timeout: 10000

# Enter org subdomain
- tapOn:
    id: "subdomain-input"
- eraseText: 64
- inputText: "${MAESTRO_TEST_SUBDOMAIN}"

# Dismiss the keyboard before reaching for the next field. On iOS it covers the lower half
# of the form, and the tap meant for the email field landed on the keyboard instead —
# leaving focus on the workspace box, which then received the email address.
- hideKeyboard
- tapOn:
    id: "email-input"

# Enter email
- eraseText: 50
- inputText: "${MAESTRO_TEST_EMAIL}"
- hideKeyboard
- tapOn:
    id: "password-input"

# Secure fields keep stale text between runs unless erased first.
- eraseText: 20
- inputText: "${MAESTRO_TEST_PASSWORD}"

# Submitting differs by platform because dismissing the keyboard does. On iOS nothing here
# blurs a secure field — hideKeyboard is refused on it and tapping the heading does not
# take focus away — so the Sign in button stays under the keyboard and only the return key
# reaches the form. Android dismisses on the heading tap and can press the button itself.
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Sign in to your workspace"
      - tapOn:
          id: "signin-button"

# iOS offers to save the password after a form submit. The sheet covers the screen and
# makes every later assertion fail, in whichever flow happens to run next — dismiss it
# here so no flow has to know about it.
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"

# Feature 036: the terms gate stands between sign-in and the app for anyone who has
# not accepted the current version — which includes every account the first time the
# version is bumped. Accept it here, in the shared bootstrap, so no individual flow
# has to know the gate exists. The gate is covered on its own terms by
# ../compliance/legal-links.yaml.
- runFlow:
    when:
      visible:
        id: "terms-gate-accept"
    commands:
      - tapOn:
          id: "terms-gate-accept"

# Wait for API call to complete and navigate
- extendedWaitUntil:
    visible: "Chat"
    timeout: 20000

# The sheet can also appear after navigation completes.
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
