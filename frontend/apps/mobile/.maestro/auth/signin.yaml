appId: com.devguards.TechOffice
name: "Auth — Sign in with email"
# The email path, reached as the quiet secondary action on the PIN-first sign-in screen.
# Coverage flows use this as their shared bootstrap, so it authenticates with credentials
# that do not depend on a PIN having been set.
---
- launchApp:
    clearState: true
    clearKeychain: true
- runFlow:
        when:
            visible: "Continue"
        commands:
            - tapOn: "Continue"
- runFlow:
        when:
            visible:
                id: "xmark"
        commands:
            - tapOn:
                    id: "xmark"
- runFlow:
        when:
            visible: "DEVELOPMENT SERVERS"
        commands:
            - tapOn:
                text: "Tech Office"
                index: 1
- runFlow:
        when:
            visible: "Continue"
        commands:
            - tapOn: "Continue"
- runFlow:
        when:
            visible:
                id: "xmark"
        commands:
            - tapOn:
                    id: "xmark"

# The sign-in screen opens on the PIN sequence. Email is the quiet secondary action.
- extendedWaitUntil:
    visible:
      id: "signin-with-email"
    timeout: 15000
- tapOn:
    id: "signin-with-email"

- extendedWaitUntil:
    visible:
      id: "subdomain-input"
    timeout: 10000

# Enter org subdomain
- tapOn:
    id: "subdomain-input"
- eraseText: 64
- inputText: "${MAESTRO_TEST_SUBDOMAIN}"
- tapOn:
    id: "email-input"

# Enter email
- eraseText: 50
- inputText: "${MAESTRO_TEST_EMAIL}"
- tapOn: "Sign in to your workspace"
- tapOn:
    id: "password-input"

# Secure fields keep stale text between runs unless erased first.
- eraseText: 20
- inputText: "${MAESTRO_TEST_PASSWORD}"
- tapOn: "Sign in to your workspace"
- tapOn:
    id: "signin-button"

# iOS offers to save the password after a form submit. The sheet covers the screen and
# makes every later assertion fail, in whichever flow happens to run next — dismiss it
# here so no flow has to know about it.
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"

# Wait for API call to complete and navigate
- extendedWaitUntil:
    visible: "Chat"
    timeout: 20000

# The sheet can also appear after navigation completes.
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
