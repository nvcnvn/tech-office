appId: com.devguards.TechOffice
name: "Compliance — Report a reply from inside a thread"
# FR-001, FR-003, FR-004. The same gesture as report-message.yaml, one screen deeper:
# long-press the reply, tap Report, tap a reason.
#
# Like report-message.yaml, this flow posts its own message and its own reply and acts
# on those. Acting on whatever a shared simulator account happens to contain is not
# deterministic — the previous generation of these flows long-pressed a voice-call
# system row, which has no message actions at all.
#
# Because the reply is the signed-in person's own, the absence of "Block this person"
# is asserted in the same long-press: you do not block yourself (FR-003).
---
- runFlow: "../auth/signin.yaml"
- runFlow:
    when:
      visible:
        id: "xmark"
    commands:
      - tapOn:
          id: "xmark"
- tapOn:
    id: "tab-chat"
- extendedWaitUntil:
    visible:
      id: "channel-row-.*"
    timeout: 10000
- tapOn:
    id: "channel-row-.*"
    index: 0
# Wait for the composer, not for an existing bubble: the first channel in a fresh
# workspace is an empty direct conversation, and this flow posts its own message
# anyway. Gating on a bubble made the flow depend on content it does not need.
- extendedWaitUntil:
    visible:
      id: "message-input"
    timeout: 10000

# A message of our own to hang a thread off.
- tapOn:
    id: "message-input"
- inputText: "Maestro thread probe ${MAESTRO_RUN_ID}"
- tapOn:
    id: "send-button"
- hideKeyboard

# Open the thread. The row is worded "Reply in thread" while the message has no
# replies, which a message sent a moment ago never does.
- longPressOn: ".*Maestro thread probe ${MAESTRO_RUN_ID}.*"
- extendedWaitUntil:
    visible:
      id: "message-action-thread"
    timeout: 5000
- tapOn:
    id: "message-action-thread"

# Post a reply, which is what the report is filed against.
- extendedWaitUntil:
    visible:
      id: "thread-reply-input"
    timeout: 10000
- tapOn:
    id: "thread-reply-input"
- inputText: "Maestro thread reply ${MAESTRO_RUN_ID}"
- tapOn:
    id: "thread-send-button"
# The thread composer is a multiline input and does not expose a standard dismiss
# action, so hideKeyboard cannot drive it. Tapping the empty middle of the reply
# list drops the keyboard, which otherwise covers the reply we are about to press.
- tapOn:
    point: "50%,45%"

# Tap 1 — long-press the reply.
- longPressOn: ".*Maestro thread reply ${MAESTRO_RUN_ID}.*"
- extendedWaitUntil:
    visible:
      id: "message-action-report"
    timeout: 5000
# FR-003: this reply is our own, so there is nobody to block.
- assertNotVisible:
    id: "message-action-block"
- takeScreenshot: "tmp/maestro-screenshots/compliance-20-thread-actions"

# Tap 2 — Report.
- tapOn:
    id: "message-action-report"
- extendedWaitUntil:
    visible:
      id: "report-sheet"
    timeout: 5000
- takeScreenshot: "tmp/maestro-screenshots/compliance-21-thread-report-sheet"

# Tap 3 — a reason. A reason on its own is a complete report.
- tapOn:
    id: "report-reason-harassment"
- extendedWaitUntil:
    visible:
      id: "report-sheet-confirmation"
    timeout: 8000
- takeScreenshot: "tmp/maestro-screenshots/compliance-22-thread-report-confirmed"
- tapOn:
    id: "report-sheet-done"
