appId: com.devguards.TechOffice
name: "Screen — More"
---
- runFlow: "../auth/signin.yaml"
- runFlow:
        when:
            visible:
                id: "xmark"
        commands:
            - tapOn:
                    id: "xmark"
- tapOn:
    id: "tab-more"
# Gate on Settings, not on Sign Out. Sign Out is the last row of the menu, so using it
# as the ready signal asserted that the whole menu fits above the fold — an invariant
# that breaks the next time a row is added, as feature 048's People row did on a 360 dp
# Android screen. Sign Out is still guarded, after the swipe that reaches it.
- extendedWaitUntil:
    visible:
      id: "menu-settings"
    timeout: 8000
- takeScreenshot: "tmp/maestro-screenshots/01-more-overview"
- swipe:
    direction: UP
    duration: 700
- extendedWaitUntil:
    visible: "Sign Out"
    timeout: 8000
- takeScreenshot: "tmp/maestro-screenshots/02-more-overview-scrolled"
# Back to the top before tapping a WORKSPACE row: the swipe above now clears Documents
# off the screen, because the People row made the menu a row taller than the blind
# 700 ms swipe was tuned against. Same scroll-back the Files step below already uses.
- swipe:
    direction: DOWN
    duration: 700
- extendedWaitUntil:
    visible:
      id: "menu-documents"
    timeout: 8000
- tapOn:
    id: "menu-documents"
- extendedWaitUntil:
    visible:
      id: "docs-search-input"
    timeout: 8000
- takeScreenshot: "tmp/maestro-screenshots/03-documents"
- swipe:
    direction: UP
    duration: 700
- takeScreenshot: "tmp/maestro-screenshots/04-documents-scrolled"
- tapOn:
    id: "more-back-button"
- swipe:
    direction: DOWN
    duration: 700
- extendedWaitUntil:
    visible:
      id: "menu-files"
    timeout: 8000
- tapOn:
    id: "menu-files"
- extendedWaitUntil:
    visible: "Files"
    timeout: 8000
- takeScreenshot: "tmp/maestro-screenshots/05-files"
- swipe:
    direction: UP
    duration: 700
- takeScreenshot: "tmp/maestro-screenshots/06-files-scrolled"
- tapOn:
    id: "more-back-button"
- extendedWaitUntil:
    visible:
      id: "edit-profile-button"
    timeout: 8000
- tapOn:
    id: "edit-profile-button"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 8000
- takeScreenshot: "tmp/maestro-screenshots/07-profile"
- swipe:
    direction: UP
    duration: 700
- takeScreenshot: "tmp/maestro-screenshots/08-profile-scrolled"
- tapOn:
    id: "more-back-button"
- extendedWaitUntil:
    visible:
      id: "menu-settings"
    timeout: 8000
- tapOn:
    id: "menu-settings"
- extendedWaitUntil:
    visible:
      id: "setting-in-app-alerts"
    timeout: 8000
- takeScreenshot: "tmp/maestro-screenshots/09-settings"
- swipe:
    direction: UP
    duration: 700
- takeScreenshot: "tmp/maestro-screenshots/10-settings-scrolled"