apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: database-migration
          image: tech-office-backend-migrate:latest
          imagePullPolicy: IfNotPresent
          args:
            - up
          envFrom:
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      containers:
        - name: backend
          image: tech-office-backend:latest
          imagePullPolicy: IfNotPresent
          # The production image is expected to use the compiled Tech Office binary
          # as its ENTRYPOINT and accept the `server` subcommand.
          args:
            - server
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          env:
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LIVEKIT_KEYS
              valueFrom:
                secretKeyRef:
                  name: livekit-secrets
                  key: LIVEKIT_KEYS
          ports:
            - name: http
              containerPort: 18080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 18
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: jwt-signing-key
              mountPath: /var/run/secrets/techoffice-jwt
              readOnly: true
            - name: fcm-service-account
              mountPath: /var/run/secrets/techoffice-fcm
              readOnly: true
      volumes:
        - name: jwt-signing-key
          secret:
            secretName: jwt-signing-key
        - name: fcm-service-account
          secret:
            secretName: fcm-service-account
            optional: true