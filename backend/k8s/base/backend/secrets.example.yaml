# Example secrets for the backend deployment.
#
# Do not add this file to a kustomization resource list with real values.
# Replace placeholders through your secret manager or GitOps secret workflow.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
type: Opaque
stringData:
  DATABASE_URL: postgres://office:replace-with-db-password@replace-with-stackgres-rw-host:5432/office?sslmode=require
  POSTGRES_DB: office
  POSTGRES_USER: office
  POSTGRES_PASSWORD: replace-with-db-password
  AWS_ACCESS_KEY_ID: replace-with-aws-access-key
  AWS_SECRET_ACCESS_KEY: replace-with-aws-secret-key
  R2_ACCESS_KEY_ID: replace-with-r2-access-key
  R2_SECRET_ACCESS_KEY: replace-with-r2-secret-key
  VOICE_RECORDING_ACCESS_KEY_ID: replace-with-recording-access-key
  VOICE_RECORDING_SECRET_ACCESS_KEY: replace-with-recording-secret-key
  WHISPER_API_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-signing-key
type: Opaque
stringData:
  jwt-private.pem: |-
    -----BEGIN PRIVATE KEY-----
    replace-with-production-private-key
    -----END PRIVATE KEY-----
---
apiVersion: v1
kind: Secret
metadata:
  name: fcm-service-account
type: Opaque
stringData:
  serviceAccount.json: |-
    {
      "type": "service_account",
      "project_id": "replace-with-firebase-project-id",
      "private_key_id": "replace-with-private-key-id",
      "private_key": "-----BEGIN PRIVATE KEY-----\nreplace-with-private-key\n-----END PRIVATE KEY-----\n",
      "client_email": "replace-with-service-account-email",
      "client_id": "replace-with-client-id"
    }