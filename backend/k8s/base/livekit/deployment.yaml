apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      enableServiceLinks: false
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.12.0
          args:
            - --config
            - /etc/livekit/livekit.yaml
          env:
            - name: LIVEKIT_KEYS
              valueFrom:
                secretKeyRef:
                  name: livekit-secrets
                  key: LIVEKIT_KEYS
            - name: LIVEKIT_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: livekit-secrets
                  key: LIVEKIT_WEBHOOK_URL
                  optional: true
          securityContext:
            capabilities:
              add:
                - NET_BIND_SERVICE
          ports:
            - name: http
              containerPort: 7880
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: livekit-config
              mountPath: /etc/livekit
              readOnly: true
      volumes:
        - name: livekit-config
          configMap:
            name: livekit-config