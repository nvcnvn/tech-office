apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
data:
  # LiveKit runs with hostNetwork: true and binds directly to the public IPv4
  # node IP (15.204.101.221) for WebRTC media. STUN is sufficient for NAT
  # traversal for the vast majority of users.
  #
  # TURN is intentionally disabled. The Cilium Gateway owns host port 443 for
  # HTTPS traffic, so an embedded TURN/TLS listener cannot co-exist on the
  # same port. If TURN fallback is required for users on very restrictive
  # networks (UDP blocked, HTTPS-only), deploy a dedicated coturn instance on
  # port 3478/UDP + 5349/TCP and reference it via livekit.yaml turn_servers[].
  livekit.yaml: |
    port: 7880
    rtc:
      port_range_start: 5000
      port_range_end: 6000
      use_external_ip: false
      node_ip: 15.204.101.221