      required_permissions: ["collab.manageRitualDefinition"]
    };
  }

  // -------------------------------------------------------------------------
  // Ritual Schedule Change
  // -------------------------------------------------------------------------

  rpc GetScheduleChangeImpact(GetScheduleChangeImpactRequest) returns (GetScheduleChangeImpactResponse) {
