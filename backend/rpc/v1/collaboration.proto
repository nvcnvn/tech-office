// =============================================================================
// MESSAGES - Custom Fields
// =============================================================================

// StringArray wrapper for repeated strings in oneof
message StringArray {
  repeated string values = 1;
}

// FieldValue - Unified typed value container for custom fields and analytics filters
// Replaces google.protobuf.Value with explicit type-safe oneof
message FieldValue {
  oneof value {
    string string_value = 1;
    double number_value = 2;
    bool bool_value = 3;
    StringArray string_array_value = 4;
  }
}

message CustomFieldDefinition {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string description = 4;
  CustomFieldType field_type = 5;
  repeated string options = 6; // For select types

  // Default value as oneof for type safety
  oneof default_value {
    string default_string_value = 7;
    double default_number_value = 8;
    bool default_bool_value = 9;
    StringArray default_string_array_value = 10; // For multi_select
  }

  bool is_required = 11;
  optional double min_value = 12;
  optional double max_value = 13;
  int32 position = 14;
  bool is_archived = 15;
}

message CustomFieldValue {
  string field_id = 1;
  string field_name = 2;
  CustomFieldType field_type = 3;

  // Value stored as unified FieldValue for type safety
  FieldValue value = 4;
}

message CreateCustomFieldRequest {
  string project_id = 1;
  string name = 2;
  optional string description = 3;
  CustomFieldType field_type = 4;
  repeated string options = 5;

  // Default value as oneof for type safety (optional)
  oneof default_value {
    string default_string_value = 6;
    double default_number_value = 7;
    bool default_bool_value = 8;
    StringArray default_string_array_value = 9; // For multi_select
  }

  optional bool is_required = 10;
  optional double min_value = 11;
  optional double max_value = 12;
}

message CreateCustomFieldResponse {
  CustomFieldDefinition field = 1;
}

message UpdateCustomFieldRequest {
  string field_id = 1;
  optional string name = 2;
  optional string description = 3;
  repeated string options = 4;

  // Default value as oneof for type safety (optional)
  oneof default_value {
    string default_string_value = 5;
    double default_number_value = 6;
    bool default_bool_value = 7;
    StringArray default_string_array_value = 8; // For multi_select
  }

  optional bool is_required = 9;
  optional double min_value = 10;
  optional double max_value = 11;
}

message UpdateCustomFieldResponse {
  CustomFieldDefinition field = 1;
}

message ArchiveCustomFieldRequest {
  string field_id = 1;
  bool archive = 2;
}

message ArchiveCustomFieldResponse {
  CustomFieldDefinition field = 1;
}

message ListCustomFieldsRequest {
  string project_id = 1;
  optional bool include_archived = 2;
}

message ListCustomFieldsResponse {
  repeated CustomFieldDefinition fields = 1;
}

message SetCustomFieldValueRequest {
  string task_id = 1;
  string field_id = 2;

  // Value as oneof for type safety
  oneof value {
    string string_value = 3;
    double number_value = 4;
    bool bool_value = 5;
    StringArray string_array_value = 6; // For multi_select
  }
}

message SetCustomFieldValueResponse {
  Task task = 1;
}

