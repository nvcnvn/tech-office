}

message GetTaskByIdentifierResponse {
  Task task = 1;
}

// =============================================================================
// MESSAGES - Tasks created from chat messages
// =============================================================================

message CreateTaskFromMessageRequest {
  string source_channel_id = 1;
  string source_message_id = 2;
  string project_id = 3;
  string title = 4;
  optional string assignee_employee_id = 5;
  optional string due_date = 6; // ISO date string, e.g. "2026-09-04"
  // Subtask of the discussed task, when converting inside a task comment thread.
  optional string parent_task_id = 7;

  // Deliberately absent: task_kind, ritual_definition_id, scheduled_date,
  // completion_deadline, level_id, state_id and custom_fields. This path can only
  // produce a standard task, and the four-field limit of the quick sheet is enforced
  // by this message shape rather than by validation.
  //
  // Also absent: any flag about remembering the destination. The server records the
  // channel's destination only when none exists, so the first conversion sets it and a
  // later override leaves it untouched, without a client deciding.
}

message CreateTaskFromMessageResponse {
  Task task = 1;
  // The threaded system reply posted on the source message.
  string announcement_message_id = 2;
}

message ListTasksBySourceMessagesRequest {
  // One call per rendered page of messages, at most 200. The repeated shape is the
  // contract-level guarantee against an N+1: a per-message implementation is visibly
  // wrong against it.
  repeated string message_ids = 1;
}

message ListTasksBySourceMessagesResponse {
  // Links to tasks in projects the caller cannot access are omitted, never returned
  // with a flag: a flagged entry would leak the identifier.
  repeated MessageTaskLink links = 1;
}

message MessageTaskLink {
  string source_message_id = 1;
  string task_id = 2;
  string identifier = 3; // e.g., "PROJ-12"
  string title = 4;
  string project_id = 5;
  string state_name = 6;
  StateCategory state_category = 7;
}

message GetTaskOriginRequest {
  string task_id = 1;
}

message GetTaskOriginResponse {
  bool has_origin = 1;
  string source_channel_id = 2;
  string channel_display_name = 3;
  string source_message_id = 4;
  string author_display_name = 5;
  string excerpt_html = 6; // sanitized HTML, as stored by chat
  // False once the source message has been soft-deleted. The task and its origin
  // columns survive; only the excerpt becomes unavailable.
  bool source_message_available = 7;
}

message GetChannelTaskDestinationRequest {
  string channel_id = 1;
}

message GetChannelTaskDestinationResponse {
  // False when never set, or when the remembered project is archived, deleted or not
  // writable by the caller. The stored row is never deleted for those reasons, so the
  // setting returns if the project is unarchived.
  bool is_set = 1;
  string project_id = 2;
  string project_name = 3;
  string project_key = 4;
  ChannelDestinationUnsetReason unset_reason = 5;
}

message SetChannelTaskDestinationRequest {
  string channel_id = 1;
  optional string project_id = 2; // absent clears the remembered destination
}

message SetChannelTaskDestinationResponse {
  GetChannelTaskDestinationResponse destination = 1;
}

