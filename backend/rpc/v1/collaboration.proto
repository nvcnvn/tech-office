syntax = "proto3";

package rpc.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "rpc/v1/chat.proto";
import "rpc/v1/files.proto";
import "rpc/v1/rbac.proto";

option go_package = "github.com/nvcnvn/tech-office/backend/rpc/v1;rpcv1";

// =============================================================================
// COLLABORATION SERVICE - Task Management
// =============================================================================

service CollaborationService {
  // -------------------------------------------------------------------------
  // Project CRUD
  // -------------------------------------------------------------------------

  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.createProject"]
    };
  }

  rpc GetProject(GetProjectRequest) returns (GetProjectResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.viewProject"]
    };
  }

  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.updateProject"]
    };
  }

  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.viewProject"]
    };
  }

  rpc ArchiveProject(ArchiveProjectRequest) returns (ArchiveProjectResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.archiveProject"]
    };
  }

  // -------------------------------------------------------------------------
  // Project States
  // -------------------------------------------------------------------------

  rpc CreateProjectState(CreateProjectStateRequest) returns (CreateProjectStateResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.manageProjectState"]
    };
  }

  rpc UpdateProjectState(UpdateProjectStateRequest) returns (UpdateProjectStateResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.manageProjectState"]
    };
  }

  rpc DeleteProjectState(DeleteProjectStateRequest) returns (DeleteProjectStateResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.manageProjectState"]
    };
  }

  rpc ReorderProjectStates(ReorderProjectStatesRequest) returns (ReorderProjectStatesResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.manageProjectState"]
    };
  }

  rpc ListProjectStates(ListProjectStatesRequest) returns (ListProjectStatesResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.viewProject"]
    };
  }

  // -------------------------------------------------------------------------
  // Task Levels
  // -------------------------------------------------------------------------

  rpc CreateTaskLevel(CreateTaskLevelRequest) returns (CreateTaskLevelResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.manageTaskLevel"]
    };
  }

  rpc UpdateTaskLevel(UpdateTaskLevelRequest) returns (UpdateTaskLevelResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.manageTaskLevel"]
    };
  }

  rpc DeleteTaskLevel(DeleteTaskLevelRequest) returns (DeleteTaskLevelResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.manageTaskLevel"]
    };
  }

  rpc ListTaskLevels(ListTaskLevelsRequest) returns (ListTaskLevelsResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.viewTask"]
    };
  }

  // -------------------------------------------------------------------------
  // Task CRUD
  // -------------------------------------------------------------------------

  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.createTask"]
    };
  }

  rpc GetTask(GetTaskRequest) returns (GetTaskResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.viewTask"]
    };
  }

  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.updateTask"]
    };
  }

  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.deleteTask"]
    };
  }

  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.viewTask"]
    };
  }

  rpc GetAssignedWorkSummary(GetAssignedWorkSummaryRequest) returns (GetAssignedWorkSummaryResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.viewTask"]
    };
  }

  rpc MoveTask(MoveTaskRequest) returns (MoveTaskResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.updateTask"]
    };
  }

  rpc GetTaskByIdentifier(GetTaskByIdentifierRequest) returns (GetTaskByIdentifierResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.viewTask"]
    };
  }

  // -------------------------------------------------------------------------
  // Tasks created from chat messages
  //
  // Collaboration owns this feature end to end. Chat gains one logic-layer announce
  // method and no knowledge of tasks; no RPC below is served by ChatService.
  // -------------------------------------------------------------------------

  rpc CreateTaskFromMessage(CreateTaskFromMessageRequest) returns (CreateTaskFromMessageResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.createTask"]
    };
  }

  rpc ListTasksBySourceMessages(ListTasksBySourceMessagesRequest) returns (ListTasksBySourceMessagesResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.viewTask"]
    };
  }

  rpc GetTaskOrigin(GetTaskOriginRequest) returns (GetTaskOriginResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.viewTask"]
    };
  }

  rpc GetChannelTaskDestination(GetChannelTaskDestinationRequest) returns (GetChannelTaskDestinationResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.viewProject"]
    };
  }

  // Additionally requires the caller to be a channel administrator. That is a
  // resource check in the logic layer on top of this permission, the same shape as
  // ritual definition management.
  rpc SetChannelTaskDestination(SetChannelTaskDestinationRequest) returns (SetChannelTaskDestinationResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.createTask"]
    };
  }

  // -------------------------------------------------------------------------
  // Task Assignment
  // -------------------------------------------------------------------------

  rpc AssignTask(AssignTaskRequest) returns (AssignTaskResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.assignTask"]
    };
  }

  rpc UnassignTask(UnassignTaskRequest) returns (UnassignTaskResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.assignTask"]
    };
  }

  rpc WatchTask(WatchTaskRequest) returns (WatchTaskResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.watchTask"]
    };
  }

  rpc UnwatchTask(UnwatchTaskRequest) returns (UnwatchTaskResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.watchTask"]
    };
  }

  // -------------------------------------------------------------------------
  // Custom Fields
  // -------------------------------------------------------------------------

  rpc CreateCustomField(CreateCustomFieldRequest) returns (CreateCustomFieldResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.manageCustomField"]
    };
  }

  rpc UpdateCustomField(UpdateCustomFieldRequest) returns (UpdateCustomFieldResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.manageCustomField"]
    };
  }

  rpc ArchiveCustomField(ArchiveCustomFieldRequest) returns (ArchiveCustomFieldResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.manageCustomField"]
    };
  }

  rpc ListCustomFields(ListCustomFieldsRequest) returns (ListCustomFieldsResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.viewTask"]
    };
  }

  rpc SetCustomFieldValue(SetCustomFieldValueRequest) returns (SetCustomFieldValueResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.setCustomFieldValue"]
    };
  }

  // -------------------------------------------------------------------------
  // Workflow Rules
  // -------------------------------------------------------------------------

  rpc CreateWorkflowRule(CreateWorkflowRuleRequest) returns (CreateWorkflowRuleResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.manageWorkflowRule"]
    };
  }

  rpc UpdateWorkflowRule(UpdateWorkflowRuleRequest) returns (UpdateWorkflowRuleResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.manageWorkflowRule"]
    };
  }

  rpc DeleteWorkflowRule(DeleteWorkflowRuleRequest) returns (DeleteWorkflowRuleResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.manageWorkflowRule"]
    };
  }

  rpc ListWorkflowRules(ListWorkflowRulesRequest) returns (ListWorkflowRulesResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.viewProject"]
    };
  }

  // -------------------------------------------------------------------------
  // Project Membership
  // -------------------------------------------------------------------------

  rpc AddProjectMember(AddProjectMemberRequest) returns (AddProjectMemberResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.manageProjectMember"]
    };
  }

  rpc RemoveProjectMember(RemoveProjectMemberRequest) returns (RemoveProjectMemberResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.manageProjectMember"]
    };
  }

  rpc UpdateProjectMemberRole(UpdateProjectMemberRoleRequest) returns (UpdateProjectMemberRoleResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.manageProjectMember"]
    };
  }

  rpc ListProjectMembers(ListProjectMembersRequest) returns (ListProjectMembersResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.viewProject"]
    };
  }

  // -------------------------------------------------------------------------
  // Saved Views
  // -------------------------------------------------------------------------

  rpc CreateSavedView(CreateSavedViewRequest) returns (CreateSavedViewResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.manageSavedView"]
    };
  }

  rpc UpdateSavedView(UpdateSavedViewRequest) returns (UpdateSavedViewResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.manageSavedView"]
    };
  }

  rpc DeleteSavedView(DeleteSavedViewRequest) returns (DeleteSavedViewResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.manageSavedView"]
    };
  }

  rpc ListSavedViews(ListSavedViewsRequest) returns (ListSavedViewsResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.viewProject"]
    };
  }

  // -------------------------------------------------------------------------
  // Analytics
  // -------------------------------------------------------------------------

  rpc GetTaskAnalytics(GetTaskAnalyticsRequest) returns (GetTaskAnalyticsResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.viewAnalytics"]
    };
  }

  rpc ExportTasksCSV(ExportTasksCSVRequest) returns (ExportTasksCSVResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.exportTasks"]
    };
  }

  // -------------------------------------------------------------------------
  // Task File Upload (Domain-owned upload pattern)
  // -------------------------------------------------------------------------

  // RequestTaskFileUpload generates presigned R2 upload URL for task attachment.
  // Server verifies project membership and derives access scope from project visibility.
  // Following the same domain-owned upload pattern as ChatFileService.
  rpc RequestTaskFileUpload(RequestTaskFileUploadRequest) returns (RequestTaskFileUploadResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.taskFileUpload"]
    };
  }

  // ConfirmTaskFileUpload finalizes upload after client uploads to R2.
  // Triggers async workflows for validation, PDF conversion, and content indexing.
  // Verifies project membership again and adds file ID to task.file_ids array.
  rpc ConfirmTaskFileUpload(ConfirmTaskFileUploadRequest) returns (ConfirmTaskFileUploadResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.taskFileUpload"]
    };
  }

  // -------------------------------------------------------------------------
  // Ritual Definitions
  // -------------------------------------------------------------------------

  rpc CreateRitualDefinition(CreateRitualDefinitionRequest) returns (CreateRitualDefinitionResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.manageRitualDefinition"]
    };
  }

  rpc GetRitualDefinition(GetRitualDefinitionRequest) returns (GetRitualDefinitionResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.viewRitualDefinition"]
    };
  }

  rpc UpdateRitualDefinition(UpdateRitualDefinitionRequest) returns (UpdateRitualDefinitionResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.manageRitualDefinition"]
    };
  }

  rpc ArchiveRitualDefinition(ArchiveRitualDefinitionRequest) returns (ArchiveRitualDefinitionResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.manageRitualDefinition"]
    };
  }

  rpc ListRitualDefinitions(ListRitualDefinitionsRequest) returns (ListRitualDefinitionsResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.viewRitualDefinition"]
    };
  }

  // -------------------------------------------------------------------------
  // Evidence Requirements
  // -------------------------------------------------------------------------

  rpc CreateEvidenceRequirement(CreateEvidenceRequirementRequest) returns (CreateEvidenceRequirementResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.manageEvidenceRequirement"]
    };
  }

  rpc UpdateEvidenceRequirement(UpdateEvidenceRequirementRequest) returns (UpdateEvidenceRequirementResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.manageEvidenceRequirement"]
    };
  }

  rpc DeleteEvidenceRequirement(DeleteEvidenceRequirementRequest) returns (DeleteEvidenceRequirementResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.manageEvidenceRequirement"]
    };
  }

  rpc ListEvidenceRequirements(ListEvidenceRequirementsRequest) returns (ListEvidenceRequirementsResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.viewEvidenceRequirement"]
    };
  }

  // -------------------------------------------------------------------------
  // Evidence Submissions
  // -------------------------------------------------------------------------

  rpc SubmitEvidence(SubmitEvidenceRequest) returns (SubmitEvidenceResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.submitEvidence"]
    };
  }

  rpc ApproveEvidence(ApproveEvidenceRequest) returns (ApproveEvidenceResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.reviewEvidence"]
    };
  }

  rpc RejectEvidence(RejectEvidenceRequest) returns (RejectEvidenceResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.reviewEvidence"]
    };
  }

  rpc ListEvidenceSubmissions(ListEvidenceSubmissionsRequest) returns (ListEvidenceSubmissionsResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.viewTask"]
    };
  }

  // -------------------------------------------------------------------------
  // Evidence File Upload
  // -------------------------------------------------------------------------

  rpc RequestEvidenceFileUpload(RequestEvidenceFileUploadRequest) returns (RequestEvidenceFileUploadResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.submitEvidence"]
    };
  }

  rpc ConfirmEvidenceFileUpload(ConfirmEvidenceFileUploadRequest) returns (ConfirmEvidenceFileUploadResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["collab.submitEvidence"]
    };
  }

  // -------------------------------------------------------------------------
  // Ritual Instance Operations
  // -------------------------------------------------------------------------

  rpc SkipRitualInstance(SkipRitualInstanceRequest) returns (SkipRitualInstanceResponse) {
