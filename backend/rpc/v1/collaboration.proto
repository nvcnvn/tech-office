}

// =============================================================================
// ENUMS
// =============================================================================

enum ProjectVisibility {
  PROJECT_VISIBILITY_UNSPECIFIED = 0;
  PROJECT_VISIBILITY_PUBLIC = 1;
  PROJECT_VISIBILITY_PRIVATE = 2;
}

enum StateCategory {
  STATE_CATEGORY_UNSPECIFIED = 0;
  STATE_CATEGORY_TODO = 1;
  STATE_CATEGORY_IN_PROGRESS = 2;
  STATE_CATEGORY_DONE = 3;
  STATE_CATEGORY_CANCELLED = 4;
  STATE_CATEGORY_SCHEDULED = 5;
  STATE_CATEGORY_SUBMITTED = 6;
  STATE_CATEGORY_VERIFIED = 7;
  STATE_CATEGORY_OVERDUE = 8;
  STATE_CATEGORY_MISSED = 9;
  STATE_CATEGORY_SKIPPED = 10;
}

// Why a channel has no usable remembered task destination. An enum rather than a
// string so the one-line explanation the client shows is a client-side lookup with no
// cross-stack string to keep in sync.
enum ChannelDestinationUnsetReason {
  CHANNEL_DESTINATION_UNSET_REASON_UNSPECIFIED = 0;
  CHANNEL_DESTINATION_UNSET_REASON_NEVER_SET = 1;
  CHANNEL_DESTINATION_UNSET_REASON_PROJECT_ARCHIVED = 2;
  CHANNEL_DESTINATION_UNSET_REASON_PROJECT_DELETED = 3;
  CHANNEL_DESTINATION_UNSET_REASON_NO_ACCESS = 4;
}

enum StateType {
  STATE_TYPE_UNSPECIFIED = 0;
  STATE_TYPE_STANDARD = 1;
  STATE_TYPE_RITUAL = 2;
}

enum CustomFieldType {
  CUSTOM_FIELD_TYPE_UNSPECIFIED = 0;
  CUSTOM_FIELD_TYPE_TEXT = 1;
  CUSTOM_FIELD_TYPE_NUMBER = 2;
  CUSTOM_FIELD_TYPE_SINGLE_SELECT = 3;
  CUSTOM_FIELD_TYPE_MULTI_SELECT = 4;
  CUSTOM_FIELD_TYPE_DATE = 5;
  CUSTOM_FIELD_TYPE_USER = 6;
  CUSTOM_FIELD_TYPE_CHECKBOX = 7;
}

enum WorkflowTriggerType {
  WORKFLOW_TRIGGER_TYPE_UNSPECIFIED = 0;
  WORKFLOW_TRIGGER_TYPE_STATE_ENTERED = 1;
  WORKFLOW_TRIGGER_TYPE_STATE_EXITED = 2;
  WORKFLOW_TRIGGER_TYPE_FIELD_CHANGED = 3;
  WORKFLOW_TRIGGER_TYPE_TASK_CREATED = 4;
}

enum WorkflowActionType {
  WORKFLOW_ACTION_TYPE_UNSPECIFIED = 0;
  WORKFLOW_ACTION_TYPE_SET_STATE = 1;
  WORKFLOW_ACTION_TYPE_SET_FIELD = 2;
  WORKFLOW_ACTION_TYPE_ASSIGN_USER = 3;
  WORKFLOW_ACTION_TYPE_NOTIFY = 4;
  WORKFLOW_ACTION_TYPE_CLOSE_TASK = 5;
}

enum ProjectMemberRole {
  PROJECT_MEMBER_ROLE_UNSPECIFIED = 0;
  PROJECT_MEMBER_ROLE_OWNER = 1;
  PROJECT_MEMBER_ROLE_ADMIN = 2;
  PROJECT_MEMBER_ROLE_MEMBER = 3;
  PROJECT_MEMBER_ROLE_VIEWER = 4;
}

enum TaskAssigneeRole {
  TASK_ASSIGNEE_ROLE_UNSPECIFIED = 0;
  TASK_ASSIGNEE_ROLE_ASSIGNEE = 1;
  TASK_ASSIGNEE_ROLE_REVIEWER = 2;
  TASK_ASSIGNEE_ROLE_APPROVER = 3;
}

enum ViewType {
  VIEW_TYPE_UNSPECIFIED = 0;
  VIEW_TYPE_BOARD = 1;
  VIEW_TYPE_LIST = 2;
  VIEW_TYPE_GANTT = 3;
  VIEW_TYPE_CALENDAR = 4;
  VIEW_TYPE_TODAY = 5;
  VIEW_TYPE_HEALTH = 6;
}

enum TaskKind {
  TASK_KIND_UNSPECIFIED = 0;
  TASK_KIND_STANDARD = 1;
  TASK_KIND_RITUAL_INSTANCE = 2;
}

enum CollaborationMode {
  COLLABORATION_MODE_UNSPECIFIED = 0;
  COLLABORATION_MODE_STANDARD = 1;
  COLLABORATION_MODE_RITUAL = 2;
  COLLABORATION_MODE_MIXED = 3;
}

enum EvidenceType {
  EVIDENCE_TYPE_UNSPECIFIED = 0;
  EVIDENCE_TYPE_PHOTO = 1;
  EVIDENCE_TYPE_VOICE_MEMO = 2;
  EVIDENCE_TYPE_PDF = 3;
  EVIDENCE_TYPE_FILE = 4;
  EVIDENCE_TYPE_LINK = 5;
  EVIDENCE_TYPE_TEXT_NOTE = 6;
  EVIDENCE_TYPE_GPS_CHECKIN = 7;
}

enum ApprovalMode {
  APPROVAL_MODE_UNSPECIFIED = 0;
  APPROVAL_MODE_MANUAL = 1;
  APPROVAL_MODE_AUTO_APPROVE = 2;
}

enum ApprovalStatus {
  APPROVAL_STATUS_UNSPECIFIED = 0;
  APPROVAL_STATUS_PENDING_REVIEW = 1;
  APPROVAL_STATUS_APPROVED = 2;
  APPROVAL_STATUS_REJECTED = 3;
}

enum RecurrenceType {
  RECURRENCE_TYPE_UNSPECIFIED = 0;
  RECURRENCE_TYPE_DAILY = 1;
  RECURRENCE_TYPE_WEEKLY = 2;
  RECURRENCE_TYPE_MONTHLY = 3;
  RECURRENCE_TYPE_CUSTOM_INTERVAL = 4;
}

// NotificationPreference is imported from chat.proto

// =============================================================================
// MESSAGES - Project
// =============================================================================

message Project {
  string id = 1;
  string name = 2;
  string key = 3;
  string description = 4;
  ProjectVisibility visibility = 5;
  bool is_archived = 6;
  string owner_employee_id = 7;
  int32 member_count = 8;
  int32 task_count = 9;
  google.protobuf.Timestamp updated_at = 10;
  CollaborationMode collaboration_mode = 11;
}

message CreateProjectRequest {
  string name = 1;
  string key = 2;
  string description = 3;
  ProjectVisibility visibility = 4;
  repeated DefaultState default_states = 5; // Optional: create with default states
  CollaborationMode collaboration_mode = 6;
}

message DefaultState {
  string name = 1;
  string color = 2;
  StateCategory category = 3;
  bool is_initial = 4;
  bool is_closed = 5;
}

message CreateProjectResponse {
  Project project = 1;
  repeated ProjectState states = 2;
  repeated TaskLevel levels = 3;
}

message GetProjectRequest {
  string project_id = 1;
}

message GetProjectResponse {
  Project project = 1;
  repeated ProjectState states = 2;
  repeated TaskLevel levels = 3;
  ProjectMemberRole current_user_role = 4;
}

message UpdateProjectRequest {
  string project_id = 1;
  optional string name = 2;
  optional string description = 3;
  optional ProjectVisibility visibility = 4;
}

message UpdateProjectResponse {
  Project project = 1;
}

message ListProjectsRequest {
  optional bool include_archived = 1;
  optional string cursor = 2;
  optional int32 limit = 3;
}

message ListProjectsResponse {
  repeated Project projects = 1;
  optional string next_cursor = 2;
}

message ArchiveProjectRequest {
  string project_id = 1;
  bool archive = 2; // true = archive, false = unarchive
}

message ArchiveProjectResponse {
  Project project = 1;
}

// =============================================================================
// MESSAGES - Project State
// =============================================================================

message ProjectState {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string color = 4;
  StateCategory category = 5;
  int32 position = 6;
  bool is_initial = 7;
  bool is_closed = 8;
  StateType state_type = 9;
}

message CreateProjectStateRequest {
  string project_id = 1;
  string name = 2;
  string color = 3;
  StateCategory category = 4;
  optional int32 position = 5;
  optional bool is_initial = 6;
  optional bool is_closed = 7;
  optional StateType state_type = 8;
}

message CreateProjectStateResponse {
  ProjectState state = 1;
}

message UpdateProjectStateRequest {
  string state_id = 1;
  optional string name = 2;
  optional string color = 3;
  optional StateCategory category = 4;
  optional bool is_initial = 5;
  optional bool is_closed = 6;
  optional StateType state_type = 7;
}

message UpdateProjectStateResponse {
  ProjectState state = 1;
}

message DeleteProjectStateRequest {
  string state_id = 1;
  string migrate_to_state_id = 2; // Move existing tasks to this state
}

message DeleteProjectStateResponse {
  int32 tasks_migrated = 1;
}

message ReorderProjectStatesRequest {
  string project_id = 1;
  repeated string state_ids = 2; // New order
}

message ReorderProjectStatesResponse {
  repeated ProjectState states = 1;
}

message ListProjectStatesRequest {
  string project_id = 1;
}

message ListProjectStatesResponse {
  repeated ProjectState states = 1;
}

// =============================================================================
// MESSAGES - Task Level
// =============================================================================

message TaskLevel {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string icon = 4;
  string color = 5;
  int32 depth = 6;
}

message CreateTaskLevelRequest {
  string project_id = 1;
  string name = 2;
  optional string icon = 3;
  optional string color = 4;
  int32 depth = 5;
}

message CreateTaskLevelResponse {
  TaskLevel level = 1;
}

message UpdateTaskLevelRequest {
