message GetTaskAnalyticsRequest {
  string project_id = 1;

  // Group by dimensions
  repeated string group_by = 2; // "state", "assignee", "level", "custom_field:{field_id}"

  // Aggregations
  repeated AnalyticsAggregation aggregations = 3;

  // Filters
  repeated AnalyticsFilter filters = 4;

  // Date range
  optional string start_date = 5;
  optional string end_date = 6;
}

message AnalyticsAggregation {
  string field = 1; // "count", "custom_field:{field_id}"
  string function = 2; // "count", "sum", "avg", "min", "max"
