message RecurrenceRule {
  RecurrenceType type = 1;
  int32 interval = 2;                 // every N days/weeks/months
  repeated int32 days_of_week = 3;    // 1=Mon..7=Sun (for weekly)
  int32 day_of_month = 4;             // 1-31 (for monthly)
  NthWeekday nth_weekday = 5;         // e.g., 2nd Monday (for monthly)
  string time_of_day = 6;             // "HH:MM" format
}

message NthWeekday {
  int32 week = 1;  // 1-5
  int32 day = 2;   // 1=Mon..7=Sun
