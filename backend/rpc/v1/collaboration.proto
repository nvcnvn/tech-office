// =============================================================================
// MESSAGES - Task
// =============================================================================

message Task {
  string id = 1;
  string project_id = 2;
  string identifier = 3; // e.g., "PROJ-123"
  string title = 4;

  // Hierarchy
  optional string parent_task_id = 5;
  int32 depth = 6;
  string level_id = 7;
  int32 child_count = 8;

  // Workflow
  string state_id = 9;

  // Scheduling
  optional string start_date = 10; // ISO date string
  optional string due_date = 11;
  optional double estimated_hours = 12;

  // Integrations
  optional string channel_id = 13;
  optional string description_document_id = 14;
  repeated string file_ids = 15;

  // People
  string reporter_employee_id = 16;
  repeated TaskAssignee assignees = 17;

  // Metadata
  int32 comment_count = 18;
  google.protobuf.Timestamp updated_at = 19;

  // Custom fields (populated if requested)
  repeated CustomFieldValue custom_field_values = 20;

  // Ritual fields
  TaskKind task_kind = 21;
  string ritual_definition_id = 22;
  string scheduled_date = 23;
  google.protobuf.Timestamp completion_deadline = 24;
  string skip_reason = 25;
  TaskEvidenceProgress evidence_progress = 26;
  bool detached_from_ritual = 27;

  // Where this task came from, when it was created from a chat message. Identifiers
  // only: the human-readable origin (channel name, author, excerpt) needs a call into
  // chat and is served by GetTaskOrigin, so GetTask stays a single-domain read.
  optional string source_channel_id = 28;
  optional string source_message_id = 29;
}

message TaskAssignee {
  string employee_id = 1;
  TaskAssigneeRole role = 2;
  google.protobuf.Timestamp assigned_at = 3;
}

message CreateTaskRequest {
  string project_id = 1;
  string title = 2;
  // Absent selects the project's shallowest level. The quick sheet that creates a task
  // from a chat message has four fields and a task level is not one of them.
  optional string level_id = 3;

  optional string parent_task_id = 4;
  optional string state_id = 5; // Uses initial state if not provided
  optional string start_date = 6;
  optional string due_date = 7;
  optional double estimated_hours = 8;

  repeated string assignee_employee_ids = 9;
  repeated CreateCustomFieldValueInput custom_fields = 10;

  // Ritual fields (optional, used when creating ritual instances)
  optional TaskKind task_kind = 11;
  optional string ritual_definition_id = 12;
  optional string scheduled_date = 13;
  optional google.protobuf.Timestamp completion_deadline = 14;
}

message CreateCustomFieldValueInput {
  string field_id = 1;

  // Value as oneof for type safety
  oneof value {
    string string_value = 2;
    double number_value = 3;
    bool bool_value = 4;
    StringArray string_array_value = 5; // For multi_select
  }
}

message CreateTaskResponse {
  Task task = 1;
}

message GetTaskRequest {
  string task_id = 1;
  bool include_custom_fields = 2;
}

message GetTaskResponse {
  Task task = 1;
  repeated TaskWatcher watchers = 2;
}

message TaskWatcher {
  string employee_id = 1;
  string watch_reason = 2;
}

message UpdateTaskRequest {
  string task_id = 1;
  optional string title = 2;
  optional string state_id = 3;
  optional string start_date = 4;
  optional string due_date = 5;
  optional double estimated_hours = 6;
  optional string level_id = 7;
  optional string parent_task_id = 8;
  optional string skip_reason = 9;
}

message UpdateTaskResponse {
  Task task = 1;
  repeated WorkflowRuleExecution rule_executions = 2;
}

message WorkflowRuleExecution {
  string rule_id = 1;
  string rule_name = 2;
  string status = 3;
  optional string error_message = 4;
}

message DeleteTaskRequest {
  string task_id = 1;
  bool delete_children = 2; // If true, cascade delete children
}

message DeleteTaskResponse {
  int32 tasks_deleted = 1;
}

message ListTasksRequest {
  string project_id = 1;

  // Filters
  optional string state_id = 2;
  optional string assignee_employee_id = 3;
  optional string reporter_employee_id = 4;
  optional string level_id = 5;
  optional string parent_task_id = 6;
  optional bool root_only = 7; // Only return tasks without parent

  // Search
  optional string search_query = 8;

  // Pagination
  optional string cursor = 9;
  optional int32 limit = 10;

  // Options
  bool include_custom_fields = 11;

  // Ritual filter
  optional TaskKind task_kind = 12;
}

message ListTasksResponse {
  repeated Task tasks = 1;
  optional string next_cursor = 2;
}

message GetAssignedWorkSummaryRequest {
  optional int32 limit = 1;
  bool include_ritual_instances = 2;
}

message AssignedWorkSummaryItem {
  string task_id = 1;
  string project_id = 2;
  string project_key = 3;
  string title = 4;
  optional string due_date = 5;
  string urgency_bucket = 6;
  optional string state_name = 7;
}

message GetAssignedWorkSummaryResponse {
