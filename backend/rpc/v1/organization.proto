syntax = "proto3";

package rpc.v1;

import "google/protobuf/timestamp.proto";
import "rpc/v1/rbac.proto";

option go_package = "github.com/nvcnvn/tech-office/backend/rpc/v1;rpcv1";

service OrganizationService {
  // GetOrganizationBySubdomain resolves organization from subdomain for login page.
  // Frontend calls this before initiating OIDC flow to display org name and get org ID.
  // Example: subdomain="acme" → returns {id: "uuid", company_name: "Acme Corporation"}
  rpc GetOrganizationBySubdomain(GetOrganizationBySubdomainRequest) returns (GetOrganizationBySubdomainResponse) {
    option (rpc.v1.access_control) = {
      allow_unauthenticated: true  // Must be public for login page
    };
  }

  // RegisterOrganizationWithAdminPassword allows unauthenticated users to register a new organization along with an admin user using email and password.
  rpc RegisterOrganizationWithAdminPassword(RegisterOrganizationWithAdminPasswordRequest) returns (RegisterOrganizationWithAdminPasswordResponse) {
    option (rpc.v1.access_control) = {
      allow_unauthenticated: true
    };
  }

  // Search Methods (Multilingual Fuzzy Search)
  rpc SearchEmployees(SearchEmployeesRequest) returns (SearchEmployeesResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["org.searchEmployees"]
    };
  }

  rpc SearchDepartments(SearchDepartmentsRequest) returns (SearchDepartmentsResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["org.searchDepartments"]
    };
  }

  rpc AutocompleteEmployees(AutocompleteEmployeesRequest) returns (AutocompleteEmployeesResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["org.searchEmployees"]
    };
  }

  rpc AutocompleteDepartments(AutocompleteDepartmentsRequest) returns (AutocompleteDepartmentsResponse) {
    option (rpc.v1.access_control) = {
      required_permissions: ["org.searchDepartments"]
    };
  }
}

message GetOrganizationBySubdomainRequest {
  string subdomain = 1;  // e.g., "acme" from acme.tech-office.com
}

message GetOrganizationBySubdomainResponse {
  Organization organization = 1;
}

message RegisterOrganizationWithAdminPasswordRequest {
  string company_name = 1;
  string subdomain = 2;
  string admin_email = 3;
  string admin_password = 4;
  string admin_given_name = 5;
  string admin_family_name = 6;
}

message RegisterOrganizationWithAdminPasswordResponse {
  Organization organization = 1;
}

message Organization {
  string id = 1;
  string company_name = 2;
  string subdomain = 3;
  string client_id = 4;
  string status = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// ============================================================
// EMPLOYEE SEARCH
// ============================================================

message SearchEmployeesRequest {
  string query_text = 1;  // User's search query
  int32 limit = 2;        // Max results (default: 50, max: 100)
  string cursor = 3;      // Pagination cursor (UUID from last result)
}

message SearchEmployeesResponse {
  repeated EmployeeSearchResult results = 1;
  string next_cursor = 2;  // Empty if no more results
  int32 query_duration_ms = 3;
}

message EmployeeSearchResult {
  string id = 1;
  string email = 2;
  string given_name = 3;
  string family_name = 4;
  bool is_active = 5;
  float relevance_score = 6;  // Trigram similarity score (0-1)
  google.protobuf.Timestamp updated_at = 7;
}

// ============================================================
// DEPARTMENT SEARCH
// ============================================================

message SearchDepartmentsRequest {
  string query_text = 1;
  int32 limit = 2;
  string cursor = 3;
}

message SearchDepartmentsResponse {
  repeated DepartmentSearchResult results = 1;
  string next_cursor = 2;
  int32 query_duration_ms = 3;
}

message DepartmentSearchResult {
  string id = 1;
  string name = 2;
  string description = 3;
  int32 member_count = 4;
  string parent_department_id = 5;  // Empty if root department
  float relevance_score = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// ============================================================
// AUTOCOMPLETE
// ============================================================

message AutocompleteEmployeesRequest {
  string prefix = 1;  // Prefix to match (e.g., "joh")
  int32 limit = 2;    // Max suggestions (default: 10, max: 20)
}

message AutocompleteEmployeesResponse {
  repeated EmployeeAutocompleteSuggestion suggestions = 1;
}

message EmployeeAutocompleteSuggestion {
  string id = 1;
  string email = 2;
  string given_name = 3;
  string family_name = 4;
}

message AutocompleteDepartmentsRequest {
  string prefix = 1;
  int32 limit = 2;
}

message AutocompleteDepartmentsResponse {
  repeated DepartmentAutocompleteSuggestion suggestions = 1;
}

message DepartmentAutocompleteSuggestion {
  string id = 1;
  string name = 2;
  string description = 3;
}
