version: v2
managed:
  enabled: true
plugins:
  - remote: buf.build/protocolbuffers/go
    out: .
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: .
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v2.2.3
    out: ../frontend/packages/rpc
    include_imports: true
    opt: target=ts
