tasks:
- "Overdue and missed rituals become real states with alerts. Add a reconciliation sweep so a ritual instance whose deadline passes with no evidence moves to overdue and later to missed, and notify the assignee and the reviewer. Today an owner only learns a checklist was skipped by opening a health report; the headline promise depends on the worker volunteering. Clears drift D29."
- "Evidence review queue for managers. One 'needs your review' surface on web and mobile listing pending submissions across all rituals, with approve and reject inline. Approval is per task today and mobile cannot approve at all, so a manager on the floor cannot close the loop from the phone."
- "Ritual assignment follows the shift. Add an assignment strategy that picks whoever has a shift calendar event covering the scheduled date, alongside round-robin and least-assigned. The schedule and the checklist exist but are not connected; round-robin assigns the closing count to someone who is not in."
- "Attach a procedure document to a ritual definition. One optional document link on the definition, shown on every instance and in the evidence capture flow. Definitions have only a free-text description, so the promise that the procedure sits next to the checklist item is unfulfilled."
- "Owners and managers create projects and rituals on mobile. The feature tour marks these stops web-only and an owner cannot set up tomorrow's checklist while standing in the store. Clears drift D38."
- "Server-side federated search. Wire documents, files, tasks and calendar events into the search box on both platforms, each source enforcing its own access rules. Searching a document title from the search box returns nothing today, while messy search history is a stated reason to leave WhatsApp. Clears drift D5."
- "Link previews in chat. Render the existing canonical-link preview endpoint as a card when a message contains a task, document or event link. The endpoint exists and nothing renders it; a pasted task link is the most common way work crosses from chat to tasks and it is bare text."
- "Owner's Today on mobile shows the team, not just self. For anyone with review permission, add a team block listing rituals overdue or unassigned today across the workspace. The Today tab only reads the caller's own assigned work, so the owner's phone answers 'what do I owe' but not 'is the store OK'."
- "People directory on mobile. Read-only list of colleagues with department, role and phone, with tap-to-message and tap-to-call. Department search results are inert on mobile because there is no screen to open, and the owner cannot look up a worker's number."
- "Document edit conflict protection. Reject an update whose base version is stale and let the client reload and retry, instead of last-write-wins. Two people editing the same procedure silently lose one person's work; this is the smallest fix that prevents data loss without CRDT merge."
- "Mobile dark mode. Thread the palette through the mobile screens and read the stored theme preference. Web has it and the tokens exist, but mobile is pinned to light. Clears drift D30."
- "Notification preference completeness. Allow the calendar domain to be muted like every other domain, and move the in-app alert toggle from device-local storage to the server preference so it follows the person. The settings screen promises a control that does not fully apply. Clears drift D28."
- "Unreachable callee still gets a missed call. Decide drift D22: write the call record and the missed-call system message even when a direct call is refused immediately as unreachable, so an offline worker returning to the app sees that the manager tried to reach them."
- "Finish or cut file content indexing. Post-processing is partly a skeleton while file search advertises content matching. Either make text and PDF extraction work end to end and drop OCR, or remove the content index and search by filename only. A half-working feature costs more trust than an honestly absent one."
- "Production safety defaults. Fail startup outside a development profile when SSO audience validation is off, when the JWT signing key is ephemeral, or when CORS allows all origins. All three are logged as dev-only and nothing stops a hosted deployment shipping that way."
- "Green and enforced test gates. Fix the four failing web E2E specs, restore the Maestro fixture account, add mobile typecheck to CI, and fix the three mobile type errors. Constitution II names the suites as the correctness gate and today they cannot be trusted to say no. Clears drift D34, D40, D41."
- "Prune what nothing uses. Drop the reserved channel types and empty schemas for CRM, support, payroll and similar, the biometric credential type, and legacy route normalisation. Every reserved value is a constraint new work must route around, and the no-backward-compatibility stance makes removal free."
