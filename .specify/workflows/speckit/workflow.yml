schema_version: "1.0"
workflow:
  id: "speckit"
  name: "Full SDD Cycle"
  version: "1.0.0"
  author: "GitHub"
  description: "Runs specify → plan → tasks → implement with review gates"

requires:
  speckit_version: ">=0.7.2"
  integrations:
    any: ["copilot", "claude", "gemini"]

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "copilot"
    prompt: "Integration to use (e.g. claude, copilot, gemini)"
  scope:
    type: string
    default: "full"
    enum: ["full", "backend-only", "frontend-only"]

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "Review the generated spec before planning."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-plan
    type: gate
    message: "Review the plan before generating tasks."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: update-snapshot
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: |
      Based on the changes implemented in {{ inputs.spec }}, update the corresponding
      living snapshot in docs/domain/ to reflect the new system state, and ensure any
      deprecated behavior is removed.

      docs/domain/ is the source of truth for CURRENT system behaviour; specs/ records
      historical intent only. Requirements:
      - Update every domain document the change touches (an RPC surface, a database
        constraint, a background job cadence, or a cross-domain call each count).
      - DELETE superseded behaviour rather than annotating it. Do not leave a "previously
        X, now Y" trail.
      - Update the drift register in docs/domain/README.md: remove rows this change fixes,
        add rows for any new inconsistency you found and did not fix.
      - Update the "Status date" line of each document you edit.
      - Per Constitution principle XII this runs only AFTER implementation is complete and
        the integration suite passes, so the snapshot records verified behaviour.
