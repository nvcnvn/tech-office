# Always deployed merged with core.yml (deploy.sh does this) — the overlay network
# and shared volumes are defined there.
#
# Observability profile — entirely optional.
#
# OpenObserve is one container doing what Prometheus + Grafana + Alertmanager used to
# do here: metric storage, PromQL, dashboards and alerting. It does not scrape, so a
# single OpenTelemetry collector does the scraping and pushes over OTLP.
#
# Drop `observability` from PROFILES if you already run your own. Nothing else in the
# stack depends on it; the only coupling is the textfile volume the backup service
# writes its freshness metric into.

x-logging: &logging
  driver: json-file
  options: {max-size: "20m", max-file: "3"}

services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.92.2
    environment:
      ZO_ROOT_USER_EMAIL: ${OBSERVE_ROOT_EMAIL}
      ZO_ROOT_USER_PASSWORD: ${OBSERVE_ROOT_PASSWORD}
      ZO_DATA_DIR: /data
      # Single node, SQLite metadata, local Parquet files. Clustered mode wants etcd
      # and object storage, which is a different deployment for a different scale.
      ZO_LOCAL_MODE: "true"
      ZO_LOCAL_MODE_STORAGE: disk
      ZO_COMPACT_DATA_RETENTION_DAYS: ${OBSERVE_RETENTION_DAYS}
      ZO_TELEMETRY: "false"
      ZO_HTTP_PORT: "5080"
    # Not behind Traefik on purpose: no public observability UI. Reach it over an SSH
    # tunnel, or open 5080 to your admin subnet only — Swarm host-mode publishing
    # cannot bind to a single interface.
    ports:
      - {target: 5080, published: 5080, protocol: tcp, mode: host}
    networks: [internal]
    volumes:
      - openobserve-data:/data
    logging: *logging
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.techoffice.obs == true]
      restart_policy: {condition: any, delay: 10s}
      update_config: {order: stop-first, failure_action: rollback}
      resources:
        limits: {memory: 2G, cpus: "1.5"}
        reservations: {memory: 512M}

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    command: ["--config=/etc/otel/config.yaml"]
    networks: [internal]
    configs:
      - {source: otel_config, target: /etc/otel/config.yaml}
    logging: *logging
    deploy:
      # One collector for the whole fleet, not one per node: it discovers every
      # exporter task through Swarm DNS, so a second copy would only duplicate
      # every series.
      replicas: 1
      placement:
        constraints: [node.labels.techoffice.obs == true]
      restart_policy: {condition: any, delay: 10s}
      resources:
        limits: {memory: 512M, cpus: "0.5"}

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker/.+)($$|/)
      - --collector.textfile.directory=/metrics
    networks: [internal]
    volumes:
      - {type: bind, source: /, target: /host, read_only: true, bind: {propagation: rslave}}
      - metrics-textfile:/metrics
    logging: *logging
    deploy:
      mode: global
      restart_policy: {condition: any, delay: 10s}
      resources:
        limits: {memory: 256M, cpus: "0.25"}

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    command: ["--docker_only=true", "--housekeeping_interval=30s"]
    networks: [internal]
    volumes:
      - {type: bind, source: /, target: /rootfs, read_only: true}
      - {type: bind, source: /var/run, target: /var/run, read_only: true}
      - {type: bind, source: /sys, target: /sys, read_only: true}
      - {type: bind, source: /var/lib/docker, target: /var/lib/docker, read_only: true}
    logging: *logging
    deploy:
      mode: global
      restart_policy: {condition: any, delay: 10s}
      resources:
        limits: {memory: 512M, cpus: "0.5"}

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    command: ["--extend.query-path=/etc/pg-queries.yml"]
    environment:
      DATA_SOURCE_NAME: ${DATABASE_URL}
    networks: [internal]
    configs:
      - {source: pg_queries, target: /etc/pg-queries.yml}
    logging: *logging
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.techoffice.obs == true]
      restart_policy: {condition: any, delay: 10s}
      resources:
        limits: {memory: 256M, cpus: "0.25"}

volumes:
  openobserve-data: {}
  metrics-textfile: {}

configs:
  otel_config:
    name: techoffice_otel_${CONFIG_VERSION}
    file: ../config/openobserve/otel-collector.yaml
  pg_queries:
    name: techoffice_pgqueries_${CONFIG_VERSION}
    file: ../config/openobserve/pg-queries.yml
