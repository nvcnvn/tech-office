# Always deployed merged with core.yml (deploy.sh does this) — the overlay network
# and shared volumes are defined there.
# Processing profile: file scanning, document conversion, speech-to-text.
#
# All three are optional in the sense that the backend degrades rather than fails
# when they are down, but uploads stay unscanned without ClamAV — do not disable it
# on a deployment that accepts files from users.

x-logging: &logging
  driver: json-file
  options: {max-size: "20m", max-file: "3"}

services:
  clamav:
    image: clamav/clamav-debian:1.4
    networks: [internal]
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    logging: *logging
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.techoffice.processing == true]
      restart_policy: {condition: any, delay: 10s}
      resources:
        # clamd holds the whole signature database in memory. Under ~2G it is killed
        # mid-scan and every upload fails validation.
        limits: {memory: 2560M, cpus: "2.0"}
        reservations: {memory: 2G}

  gotenberg:
    image: gotenberg/gotenberg:8
    command: ["gotenberg", "--api-timeout=30s", "--api-port=8081"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.techoffice.processing == true]
      restart_policy: {condition: any, delay: 10s}
      resources:
        limits: {memory: 1500M, cpus: "2.0"}

  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    environment:
      WHISPER__MODEL: ${WHISPER_MODEL}
      HF_HOME: /app/hf-cache
    networks: [internal]
    volumes:
      - whisper-cache:/app/hf-cache
    healthcheck:
      # python3, not curl: this image ships neither curl nor wget, so a curl-based
      # check can never pass — the container serves fine, Docker marks it unhealthy,
      # and Swarm SIGKILLs it forever.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    logging: *logging
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.techoffice.processing == true]
      restart_policy: {condition: any, delay: 10s}
      resources:
        # CPU whisper will take every core it is given. Capped so a single
        # transcription cannot stall the database.
        limits: {memory: 3G, cpus: "3.0"}

volumes:
  clamav-db: {}
  whisper-cache: {}
