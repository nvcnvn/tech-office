# Core stack: edge proxy, database, backend, web.
# Deployed by deploy/scripts/deploy.sh — it exports deploy/.env into the environment
# first, so every ${VAR} below resolves from there.

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # --- Edge ------------------------------------------------------------------
  traefik:
    image: traefik:v3.3
    command: ["--configFile=/etc/traefik/traefik.yml"]
    # Host-mode publishing, not the routing mesh: it preserves the client source IP
    # (access logs, rate limiting) and keeps port 80/443 on the edge node only.
    ports:
      - {target: 80, published: 80, protocol: tcp, mode: host}
      - {target: 443, published: 443, protocol: tcp, mode: host}
    networks: [internal]
    volumes:
      - traefik-acme:/acme
    configs:
      - {source: traefik_static, target: /etc/traefik/traefik.yml}
      - {source: traefik_routes, target: /etc/traefik/dynamic/routes.yml}
      - {source: traefik_tls, target: /etc/traefik/dynamic/tls.yml}
    secrets: [tls.crt, tls.key, tls2.crt, tls2.key]
    logging: *logging
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.techoffice.edge == true]
      restart_policy: {condition: any, delay: 5s}
      update_config: {order: stop-first, failure_action: rollback}
      resources:
        limits: {memory: 256M, cpus: "1.0"}

  # --- Database --------------------------------------------------------------
  # One node holds every table, so a physical backup of it is a complete backup of
  # the system. Scaling out is read replicas first; see deploy/README.md.
  # ponytail: no replica, no automatic failover — deliberate (see deploy/README.md
  # "What this deployment is not"). Recovery is restore-from-S3, minutes not seconds.
  postgres:
    image: ${IMAGE_PREFIX}tech-office-postgres:${RELEASE_TAG}
    # Tuned for the reference box: 6 cores / 12 threads, 32 GB, NVMe, sharing the
    # machine with everything else in this file. deploy/README.md "Sizing" has the
    # arithmetic; the env vars it derives live in deploy/.env.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_textsearch,pg_stat_statements
      # --- Memory ---------------------------------------------------------
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=512MB
      - -c
      - autovacuum_work_mem=256MB
      - -c
      - max_connections=${PG_MAX_CONNECTIONS}
      - -c
      - superuser_reserved_connections=5
      # Free if the host has hugepages configured, silently ignored if not.
      - -c
      - huge_pages=try
      # `docker stack deploy` ignores shm_size, so /dev/shm stays at 64 MB and
      # parallel hash joins fail with "could not resize shared memory segment".
      # SysV shared memory does not go through /dev/shm at all.
      - -c
      - dynamic_shared_memory_type=sysv
      # --- Storage: NVMe, not spinning rust -------------------------------
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=32
      - -c
      - maintenance_io_concurrency=64
      # PG18 asynchronous I/O — the single biggest reason to be on 18. io_uring
      # would need the io_uring_* syscalls unblocked, and swarm ignores
      # security_opt, so worker processes it is. Four for six cores.
      - -c
      - io_method=worker
      - -c
      - io_workers=4
      - -c
      - io_max_combine_limit=256kB
      - -c
      - io_combine_limit=256kB
      # --- Parallelism: 6 cores, shared with the rest of the stack ---------
      - -c
      - max_worker_processes=12
      - -c
      - max_parallel_workers=6
      - -c
      - max_parallel_workers_per_gather=2
      - -c
      - max_parallel_maintenance_workers=4
      # --- WAL and checkpoints --------------------------------------------
      - -c
      - wal_compression=zstd
      - -c
      - wal_buffers=64MB
      - -c
      - min_wal_size=2GB
      - -c
      - max_wal_size=8GB
      - -c
      - checkpoint_timeout=15min
      # --- Autovacuum ------------------------------------------------------
      - -c
      - autovacuum_max_workers=4
      # PG18 caps the scale factor with an absolute row count, so a large table
      # is vacuumed every 5M dead rows instead of every 20% of a growing table.
      - -c
      - autovacuum_vacuum_max_threshold=5000000
      - -c
      - autovacuum_vacuum_cost_limit=2000
      # --- Observability ---------------------------------------------------
      - -c
      - track_io_timing=on
      - -c
      - track_wal_io_timing=on
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_autovacuum_min_duration=10s
      - -c
      - log_lock_failures=on
      # WAL archiving is what makes point-in-time recovery possible. If the archive
      # cannot be written Postgres retains the WAL and eventually fills its disk —
      # that is the correct failure mode, and PostgresArchiveFailing alerts on it.
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --config=/run/secrets/pgbackrest.conf --stanza=techoffice archive-push %p
      - -c
      - archive_timeout=300
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    networks: [internal]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgsocket:/var/run/postgresql
      - pgbackrest-lock:/var/lib/pgbackrest-lock
    secrets: [pgbackrest.conf]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    logging: *logging
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.techoffice.db == true]
      restart_policy: {condition: any, delay: 10s}
      # stop-first: two postgres processes must never hold the same data directory.
      update_config: {order: stop-first, failure_action: pause}
      resources:
        # No CPU limit on purpose: postgres is the one service that must never be
        # throttled, and every other service here is capped so it cannot starve it.
        # The memory ceiling also caps the page cache charged to this cgroup, which
        # is why effective_cache_size is set to match it.
        limits: {memory: 10G}
        reservations: {memory: 6G, cpus: "4.0"}

  # --- Application -----------------------------------------------------------
  backend:
    image: ${IMAGE_PREFIX}tech-office-backend:${RELEASE_TAG}
    command: ["server"]
    environment:
      SERVER_PORT: "18080"
      # Pool metrics. Not routed by Traefik — overlay network only.
      METRICS_PORT: "18090"
      # Soft heap ceiling under the 1500M hard limit: the GC works harder instead
      # of the container being OOM-killed mid-request.
      GOMEMLIMIT: 1200MiB
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      FLOW_SHARD_COUNT: ${FLOW_SHARD_COUNT}
      WEBAPP_URL: https://${WEB_DOMAIN}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt.pem
      GOOGLE_APPLICATION_CREDENTIALS: ${FCM_CREDENTIALS_PATH}
      APNS_VOIP_KEY_PATH: ${APNS_VOIP_KEY_PATH}
      APNS_VOIP_KEY_ID: ${APNS_VOIP_KEY_ID}
      APNS_VOIP_TEAM_ID: ${APNS_VOIP_TEAM_ID}
      APNS_VOIP_TOPIC: ${APNS_VOIP_TOPIC}
      APNS_VOIP_USE_SANDBOX: ${APNS_VOIP_USE_SANDBOX}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS}
      APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL}
      SES_REPLY_TO_EMAIL: ${SES_REPLY_TO_EMAIL}
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      DEFAULT_MAX_FILE_SIZE_BYTES: ${DEFAULT_MAX_FILE_SIZE_BYTES}
      DEFAULT_QUOTA_BYTES: ${DEFAULT_QUOTA_BYTES}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      GOTENBERG_URL: http://gotenberg:8081
      LIVEKIT_URL: ${LIVEKIT_BACKEND_URL}
      PUBLIC_LIVEKIT_URL: wss://${MEDIA_DOMAIN}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      VOICE_MAX_PARTICIPANTS: ${VOICE_MAX_PARTICIPANTS}
      VOICE_QUALITY_POLICY: ${VOICE_QUALITY_POLICY}
      VOICE_RECORDING_ENABLED: ${VOICE_RECORDING_ENABLED}
      VOICE_TRANSCRIPTION_ENABLED: ${VOICE_TRANSCRIPTION_ENABLED}
      WHISPER_API_URL: http://whisper:8000
      WHISPER_MODEL: ${WHISPER_MODEL}
    networks: [internal]
    secrets: [jwt.pem, fcm.json, apns.p8]
    healthcheck:
      # The image is distroless; the binary checks itself.
      test: ["CMD", "/usr/local/bin/tech-office", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    logging: *logging
    deploy:
      replicas: ${BACKEND_REPLICAS}
      placement:
        constraints: [node.labels.techoffice.app == true]
        preferences: [{spread: node.id}]
      restart_policy: {condition: any, delay: 5s}
      update_config: {order: start-first, parallelism: 1, delay: 15s, failure_action: rollback, monitor: 45s}
      rollback_config: {order: start-first, parallelism: 1}
      resources:
        # Go 1.25 reads GOMAXPROCS from this cgroup quota, so 2 CPUs here means
        # 2 there — 3 replicas cannot collectively outbid postgres for the 6 cores.
        limits: {memory: 1500M, cpus: "2.0"}
        reservations: {memory: 512M}

  web:
    image: ${WEB_IMAGE_REF}
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=640
      PORT: "13000"
      HOSTNAME: 0.0.0.0
    networks: [internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:13000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging
    deploy:
      replicas: ${WEB_REPLICAS}
      placement:
        constraints: [node.labels.techoffice.app == true]
        preferences: [{spread: node.id}]
      restart_policy: {condition: any, delay: 5s}
      update_config: {order: start-first, parallelism: 1, delay: 10s, failure_action: rollback}
      resources:
        limits: {memory: 768M, cpus: "1.0"}

networks:
  internal:
    name: techoffice_internal
    driver: overlay
    # attachable so deploy.sh can run the one-shot migration container on it.
    attachable: true
    driver_opts:
      encrypted: "true"

volumes:
  pgdata: {}
  pgsocket: {}
  pgbackrest-lock: {}
  traefik-acme: {}

# Swarm configs are immutable, so the name carries a content hash computed by
# deploy.sh. Editing a config file therefore rolls the services that mount it.
configs:
  traefik_static:
    name: techoffice_traefik_static_${CONFIG_VERSION}
    file: ../config/traefik/traefik.yml
  traefik_routes:
    name: techoffice_traefik_routes_${CONFIG_VERSION}
    file: ../config/traefik/dynamic/routes.yml
  traefik_tls:
    name: techoffice_traefik_tls_${CONFIG_VERSION}
    file: ../config/traefik/dynamic/tls.yml

secrets:
  jwt.pem:
    name: techoffice_jwt_${SECRET_VERSION}
    file: ../secrets/jwt-private.pem
  fcm.json:
    name: techoffice_fcm_${SECRET_VERSION}
    file: ../secrets/fcm.json
  apns.p8:
    name: techoffice_apns_${SECRET_VERSION}
    file: ../secrets/apns.p8
  pgbackrest.conf:
    name: techoffice_pgbackrest_${SECRET_VERSION}
    file: ../secrets/pgbackrest.conf
  tls.crt:
    name: techoffice_tlscrt_${SECRET_VERSION}
    file: ../secrets/tls.crt
  tls.key:
    name: techoffice_tlskey_${SECRET_VERSION}
    file: ../secrets/tls.key
  # Second certificate for a deployment whose web and api hostnames are on
  # different registrable domains. A placeholder here means "only one certificate";
  # lib.sh leaves it out of the Traefik configuration in that case.
  tls2.crt:
    name: techoffice_tls2crt_${SECRET_VERSION}
    file: ../secrets/tls2.crt
  tls2.key:
    name: techoffice_tls2key_${SECRET_VERSION}
    file: ../secrets/tls2.key
