groups:
  - name: techoffice
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} is unreachable"

      - alert: PostgresDown
        expr: pg_up == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "PostgreSQL is down — the entire application is offline"

      # The three alerts that matter most: they are the ones that fire *before* a
      # restore is needed, while it can still succeed.
      - alert: BackupTooOld
        expr: time() - max by (type) (techoffice_pgbackrest_last_backup_timestamp_seconds) > 93600
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "No successful pgBackRest backup in over 26 hours"
          description: "Check `docker service logs techoffice_pgbackup`. Until this clears, recovery depends on WAL replay from an ageing base backup."

      - alert: BackupFailed
        expr: techoffice_pgbackrest_last_backup_status != 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Last {{ $labels.type }} backup failed"

      - alert: WALArchivingFailing
        expr: increase(pg_stat_archiver_failed_count[15m]) > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "WAL archiving to object storage is failing"
          description: "Point-in-time recovery is broken and the database disk will fill as WAL accumulates."

      - alert: WALArchiveStalled
        expr: pg_stat_archiver_seconds_since_last_archive > 1800
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "No WAL segment archived in 30 minutes"

      - alert: DiskSpaceLow
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes < 0.10
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.mountpoint }} is below 10% free"

      - alert: DiskWillFillIn24h
        expr: predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[6h], 24 * 3600) < 0
        for: 30m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.mountpoint }} fills within 24 hours at the current rate"

      - alert: PostgresConnectionsNearLimit
        expr: sum(pg_stat_activity_count) by (instance) > 0.85 * max(pg_settings_max_connections) by (instance)
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "PostgreSQL is above 85% of max_connections"

      - alert: TLSCertificateExpiringSoon
        expr: (traefik_tls_certs_not_after - time()) / 86400 < 14
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "TLS certificate for {{ $labels.cn }} expires in under 14 days"

      - alert: HighServerErrorRate
        expr: |
          sum(rate(traefik_service_requests_total{code=~"5.."}[5m])) by (service)
            / sum(rate(traefik_service_requests_total[5m])) by (service) > 0.05
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.service }} is returning more than 5% 5xx"
